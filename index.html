<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── useInView hook ─────────────────────────────────────────── */
function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setInView(true); obs.disconnect(); }
    }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, inView];
}

/* ── AnimatedNumber hook ───────────────────────────────────── */
function AnimatedNumber({ target, suffix = '', inView, duration = 1800 }) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    if (!inView) return;
    const start = performance.now();
    const animate = (now) => {
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setValue(Math.round(eased * target));
      if (p < 1) requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
  }, [inView, target, duration]);
  return React.createElement(React.Fragment, null, value + suffix);
}

/* ── TOKENS ─────────────────────────────────────────────────── */
const T = {
  teal:        '#1b7a82',
  tealDark:    '#0f3f45',
  tealMid:     '#155f66',
  tealLight:   '#d4eef0',
  gold:        '#c9a84c',
  goldLight:   '#f0e4c0',
  cream:       '#f9f6f0',
  creamDark:   '#f2ede4',
  white:       '#ffffff',
  text:        '#1a1a1a',
  textMuted:   '#5a6a6b',
  border:      '#e0d8cc',
};

/* ── Viewport Context ───────────────────────────────────────── */
const ViewportCtx = React.createContext({ isMobile: false, isTablet: false });
const useViewport = () => React.useContext(ViewportCtx);

/* ── Scroll Progress Bar ────────────────────────────────────── */
function ScrollProgress() {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const handler = () => {
      const total = document.documentElement.scrollHeight - window.innerHeight;
      setProgress(total > 0 ? (window.scrollY / total) * 100 : 0);
    };
    window.addEventListener('scroll', handler, { passive: true });
    return () => window.removeEventListener('scroll', handler);
  }, []);
  return (
    <div style={{ position: 'fixed', top: 0, left: 0, right: 0, height: 3, zIndex: 999, background: 'rgba(0,0,0,0.08)' }}>
      <div style={{
        height: '100%',
        background: `linear-gradient(to right, ${T.gold}, ${T.teal})`,
        width: `${progress}%`,
        transition: 'width 80ms linear',
        borderRadius: '0 2px 2px 0',
      }} />
    </div>
  );
}

/* ── Cursor Glow (desktop only) ─────────────────────────────── */
function CursorGlow() {
  const [pos, setPos] = useState({ x: -400, y: -400 });
  const [active, setActive] = useState(false);
  useEffect(() => {
    if (window.matchMedia('(hover: none)').matches) return;
    const move = (e) => { setPos({ x: e.clientX, y: e.clientY }); setActive(true); };
    window.addEventListener('mousemove', move, { passive: true });
    return () => window.removeEventListener('mousemove', move);
  }, []);
  if (!active) return null;
  return (
    <div style={{
      position: 'fixed',
      left: pos.x - 220,
      top: pos.y - 220,
      width: 440,
      height: 440,
      borderRadius: '50%',
      background: 'radial-gradient(circle, rgba(27,122,130,0.05) 0%, transparent 70%)',
      pointerEvents: 'none',
      zIndex: 9998,
      transition: 'left 200ms ease-out, top 200ms ease-out',
    }} />
  );
}

/* ── WhatsApp ordering helper ───────────────────────────────── */

    ? `Hi Nevisan! I would like to order *${teaName}* (₹499). Please help me with the order details.`
    : 'Hi Nevisan! I would like to order your tea. Please help me with the details.';
  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
}

/* ── NAV ─────────────────────────────────────────────────────── */
function HamburgerIcon({ open }) {
  return (
    <div style={{ width: 24, height: 18, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', cursor: 'pointer' }}>
      {[0, 1, 2].map(i => (
        <span key={i} style={{
          display: 'block', height: 2, background: T.white, borderRadius: 2,
          transformOrigin: 'left center',
          transition: 'transform 300ms ease, opacity 300ms ease, width 300ms ease',
          transform: open
            ? i === 0 ? 'rotate(43deg) translateY(-1px)'
            : i === 2 ? 'rotate(-43deg) translateY(1px)'
            : 'scaleX(0)'
            : 'none',
          opacity: open && i === 1 ? 0 : 1,
          width: open ? (i === 1 ? '100%' : '100%') : (i === 1 ? '75%' : '100%'),
        }} />
      ))}
    </div>
  );
}

function Nav({ page, setPage }) {
  const links = ['Home', 'Collection', 'Our Story', 'Journal', 'Contact'];
  const isHero = page === 'Home';
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

    const handler = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', handler, { passive: true });
    return () => window.removeEventListener('scroll', handler);

            <span style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: isMobile ? 15 : 18, color: T.white, letterSpacing: '0.18em', fontWeight: 400 }}>NEVISAN</span>
          </div>

          {/* Desktop links */}
          {!isMobile && (
            <div style={{ display: 'flex', gap: 32, alignItems: 'center' }}>
              {links.map(l => (
                <button key={l} onClick={() => handleNav(l)} style={{
                  background: 'none', border: 'none', cursor: 'pointer',
                  fontFamily: "'Inter', sans-serif", fontSize: 14, fontWeight: 400,
                  color: page === l ? T.gold : 'rgba(255,255,255,0.82)',
                  transition: 'color 150ms', padding: 0,
                }}
                  onMouseEnter={e => { if (page !== l) e.currentTarget.style.color = '#fff'; }}
                  onMouseLeave={e => { if (page !== l) e.currentTarget.style.color = 'rgba(255,255,255,0.82)'; }}
                >{l}</button>
              ))}
              <button
                onClick={() => handleNav('Collection')}
                style={{
                  background: T.gold, color: T.tealDark, border: 'none', borderRadius: 9999,
                  padding: '9px 22px', fontSize: 13, fontWeight: 600,
                  cursor: 'pointer', fontFamily: "'Inter', sans-serif",
                  transition: 'transform 200ms, box-shadow 200ms',
                  boxShadow: '0 2px 12px rgba(201,168,76,0.3)',
                }}
                onMouseEnter={e => { e.currentTarget.style.transform = 'scale(1.05)'; e.currentTarget.style.boxShadow = '0 4px 20px rgba(201,168,76,0.5)'; }}
                onMouseLeave={e => { e.currentTarget.style.transform = 'scale(1)'; e.currentTarget.style.boxShadow = '0 2px 12px rgba(201,168,76,0.3)'; }}

            </div>

          {/* Mobile: WhatsApp quick + hamburger */}

            <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>

                <HamburgerIcon open={menuOpen} />
              </button>
            </div>

        </div>
      </nav>

      {/* Mobile full-screen menu */}
      {isMobile && menuOpen && (
        <div style={{
          position: 'fixed', inset: 0, zIndex: 99,
          background: T.tealDark,
          display: 'flex', flexDirection: 'column',
          paddingTop: 68,
          animation: 'overlay-fade 0.25s ease both',
        }}>
          <div style={{ padding: '32px 28px', display: 'flex', flexDirection: 'column', gap: 4 }}>
            {links.map((l, i) => (
              <button key={l} onClick={() => handleNav(l)} style={{
                background: 'none', border: 'none', cursor: 'pointer', textAlign: 'left',
                fontFamily: "'Playfair Display', Georgia, serif",
                fontSize: 28, fontWeight: 400,
                color: page === l ? T.gold : 'rgba(255,255,255,0.85)',
                padding: '14px 0',
                borderBottom: i < links.length - 1 ? '1px solid rgba(255,255,255,0.08)' : 'none',
                animation: `menu-open 0.3s ease ${i * 0.06}s both`,

              <RippleButton

                style={{
                  width: '100%', background: T.gold, color: T.tealDark, border: 'none',
                  borderRadius: 9999, padding: '16px', fontSize: 15, fontWeight: 700,
                  cursor: 'pointer', fontFamily: "'Inter'",
                  display: 'flex', alignItems: 'center', justifyContent: 'center',

                hoverStyle={{ filter: 'brightness(1.05)' }}

              <button
                onClick={() => openWhatsApp()}
                style={{ marginTop: 12, width: '100%', background: '#25D366', color: '#fff', border: 'none', borderRadius: 9999, padding: '16px', fontSize: 15, fontWeight: 700, cursor: 'pointer', fontFamily: "'Inter'" }}

            </div>
            <div style={{ marginTop: 32, animation: `menu-open 0.3s ease 0.42s both` }}>
              <div style={{ fontFamily: "'Inter'", fontSize: 12, color: 'rgba(255,255,255,0.4)', marginBottom: 8 }}>nevisan12@gmail.com</div>
              <div style={{ fontFamily: "'Inter'", fontSize: 12, color: 'rgba(255,255,255,0.4)' }}>+91 98642 45687</div>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

/* ── TICKER ───────────────────────────────────────────────────── */
function Ticker() {
  const items = ['PESTICIDE-FREE', 'FSSAI APPROVED', 'CAN BE STEEPED TWICE', 'HANDCRAFTED IN ASSAM', 'SINGLE ORIGIN', 'PGS-INDIA ORGANIC', 'MADE IN INDIA', 'WHOLE LEAF'];
  const doubled = [...items, ...items];
  return (
    <div style={{ background: T.teal, overflow: 'hidden', padding: '12px 0' }}>
      <div style={{
        display: 'flex', gap: 48,
        animation: 'ticker 28s linear infinite',
        width: 'max-content',
      }}>
        {doubled.map((item, i) => (
          <span key={i} style={{
            fontFamily: "'Inter', sans-serif", fontSize: 12, fontWeight: 600,
            letterSpacing: '0.12em', color: 'rgba(255,255,255,0.9)',
            whiteSpace: 'nowrap',
            display: 'flex', alignItems: 'center', gap: 12,
          }}>
            <span style={{ color: T.gold, fontSize: 8 }}>●</span>
            {item}
          </span>
        ))}
      </div>
    </div>

}

/* ── FLOATING LEAVES ──────────────────────────────────────────── */
function FloatingLeaves() {
  const leaves = [
    { left: '8%',  delay: '0s',   dur: '7s',   size: 18, opacity: 0.18 },
    { left: '22%', delay: '1.5s', dur: '9s',   size: 14, opacity: 0.14 },
    { left: '38%', delay: '3s',   dur: '8s',   size: 22, opacity: 0.16 },
    { left: '55%', delay: '0.8s', dur: '11s',  size: 16, opacity: 0.12 },
    { left: '70%', delay: '2.2s', dur: '7.5s', size: 20, opacity: 0.15 },
    { left: '85%', delay: '4s',   dur: '9.5s', size: 12, opacity: 0.13 },
    { left: '15%', delay: '5s',   dur: '8.5s', size: 24, opacity: 0.10 },
    { left: '92%', delay: '1s',   dur: '10s',  size: 15, opacity: 0.14 },
  ];
  return (
    <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden', zIndex: 1 }}>
      {leaves.map((l, i) => (
        <div key={i} style={{
          position: 'absolute', bottom: '-40px', left: l.left,
          width: l.size, height: l.size * 1.6,
          background: `rgba(255,255,255,${l.opacity})`,
          borderRadius: '50% 10% 50% 10%',
          animation: `leaf-drift ${l.dur} ease-in-out ${l.delay} infinite`,
        }} />
      ))}
    </div>
  );
}

/* ── HERO ─────────────────────────────────────────────────────── */
function Hero({ setPage }) {
  const [visible, setVisible] = useState(false);
  const [statsRef, statsInView] = useInView(0.1);
  const [parallax, setParallax] = useState(0);
  const { isMobile } = useViewport();

  useEffect(() => {
    const t = setTimeout(() => setVisible(true), 200);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    const handler = () => setParallax(window.scrollY * 0.25);
    window.addEventListener('scroll', handler, { passive: true });
    return () => window.removeEventListener('scroll', handler);
  }, []);

  return (
    <div style={{ position: 'relative', height: '100vh', minHeight: 620, overflow: 'hidden', background: T.tealDark }}>

      <div style={{ position: 'absolute', inset: 0, zIndex: 0, overflow: 'hidden' }}>
        <video

            position: 'absolute', top: '50%', left: '50%',
            minWidth: '100%', minHeight: '100%',
            width: 'auto', height: 'auto',
            transform: `translate(-50%, calc(-50% + ${parallax}px)) scale(1.1)`,

            Single Origin · Golaghat, Assam
            <div style={{ width: 32, height: 1, background: T.gold }} />
          </div>

          {/* Headline line 1 */}
          <div style={{ overflow: 'hidden', marginBottom: 4 }}>
            <h1 style={{
              fontFamily: "'Playfair Display', Georgia, serif", fontWeight: 400,

              transition: 'opacity 0.8s ease-out 0.25s, transform 0.8s ease-out 0.25s',
            }}>
              Tea as it was
            </h1>

/* ── Ripple Button ────────────────────────────────────────────── */
function RippleButton({ children, onClick, style = {}, hoverStyle = {} }) {
  const [ripples, setRipples] = useState([]);
  const [hovered, setHovered] = useState(false);
  const btnRef = useRef(null);

  const handleClick = (e) => {
    const rect = btnRef.current.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const id = Date.now();
    setRipples(r => [...r, { x, y, id }]);
    setTimeout(() => setRipples(r => r.filter(rp => rp.id !== id)), 600);
    onClick && onClick(e);
  };

  const computedStyle = {
    position: 'relative', overflow: 'hidden',
    transition: 'transform 200ms ease, box-shadow 200ms ease',
    ...style,
    ...(hovered ? hoverStyle : {}),
  };

  return (
    <button
      ref={btnRef}
      style={computedStyle}
      onClick={handleClick}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
    >
      {children}
      {ripples.map(r => (
        <span key={r.id} style={{
          position: 'absolute',
          left: r.x - 20, top: r.y - 20,
          width: 40, height: 40,
          borderRadius: '50%',
          background: 'rgba(255,255,255,0.35)',
          animation: 'ripple-effect 0.6s ease-out forwards',
          pointerEvents: 'none',
        }} />
      ))}
    </button>
  );
}

/* ── Tea Card ─────────────────────────────────────────────────── */
function TeaCard({ tea, onView, index = 0 }) {
  const [hovered, setHovered] = useState(false);
  const [touched, setTouched] = useState(false);
  const [tilt, setTilt] = useState({ x: 0, y: 0 });
  const [ref, inView] = useInView(0.1);

  const handleMouseMove = useCallback((e) => {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width - 0.5) * 12;
    const y = ((e.clientY - rect.top) / rect.height - 0.5) * -12;
    setTilt({ x, y });
  }, []);

  const cardTransform = hovered
    ? `perspective(900px) rotateX(${tilt.y}deg) rotateY(${tilt.x}deg) translateY(-6px) scale(1.01)`
    : touched
    ? 'perspective(900px) scale(0.97)'
    : 'perspective(900px) rotateX(0) rotateY(0) translateY(0) scale(1)';

  return (
    <div
      ref={ref}
      className="card-hover-lift"
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => { setHovered(false); setTilt({ x: 0, y: 0 }); }}
      onMouseMove={handleMouseMove}
      onTouchStart={() => setTouched(true)}
      onTouchEnd={() => { setTouched(false); }}
      onClick={() => onView(tea)}
      style={{
        background: T.white, borderRadius: 16, overflow: 'hidden',
        boxShadow: hovered
          ? '0 20px 60px rgba(27,122,130,0.2), 0 4px 16px rgba(0,0,0,0.08)'
          : '0 2px 12px rgba(0,0,0,0.06)',
        transform: cardTransform,
        transition: hovered
          ? 'box-shadow 250ms ease, transform 120ms ease'
          : 'box-shadow 350ms ease, transform 350ms ease, opacity 0.6s ease-out, translate 0.6s ease-out',
        cursor: 'pointer',
        opacity: inView ? 1 : 0,
        translate: inView ? '0 0' : '0 32px',
        transitionDelay: `${index * 0.07}s`,
      }}
    >
      {/* Card image area */}
      <div style={{ background: tea.bg, height: 200, overflow: 'hidden', position: 'relative' }}>
        {tea.img ? (

/* ── APP ──────────────────────────────────────────────────────── */
function App() {
  const [page, setPage] = useState('Home');
  const [vpWidth, setVpWidth] = useState(typeof window !== 'undefined' ? window.innerWidth : 1200);

  useEffect(() => {
    const handler = () => setVpWidth(window.innerWidth);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  const viewport = { isMobile: vpWidth < 768, isTablet: vpWidth < 1024 };

  const handleSetPage = (p) => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setPage(p);
  };

  let content;
  if (page === 'Home')           content = <HomePage setPage={handleSetPage} />;
  else if (page === 'Collection') content = <><CollectionPage setPage={handleSetPage} /><Footer setPage={handleSetPage} /></>;
  else if (page === 'Our Story')  content = <OurStoryPage setPage={handleSetPage} />;
  else content = (
    <div style={{ paddingTop: 68, minHeight: '80vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: T.cream, animation: 'page-enter 0.4s ease both', flexDirection: 'column', gap: 0 }}>
      <div style={{ textAlign: 'center', padding: '0 24px' }}>
        <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: 32, color: T.text, marginBottom: 16 }}>{page}</h2>
        <p style={{ fontFamily: "'Inter'", color: T.textMuted }}>This page is a placeholder in the prototype.</p>
        <button onClick={() => handleSetPage('Home')} style={{ marginTop: 24, background: T.teal, color: T.white, border: 'none', borderRadius: 9999, padding: '12px 32px', cursor: 'pointer', fontFamily: "'Inter'", fontSize: 14, transition: 'filter 200ms' }}
          onMouseEnter={e => e.currentTarget.style.filter = 'brightness(1.1)'}
          onMouseLeave={e => e.currentTarget.style.filter = 'none'}
        >← Back to Home</button>
      </div>
    </div>
  );

  return (
    <ViewportCtx.Provider value={viewport}>
      <ScrollProgress />
      <CursorGlow />
      <Nav page={page} setPage={handleSetPage} />
      {content}
    </ViewportCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

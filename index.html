  <!-- CSS-only scroll progress bar (MWG animation-timeline) -->

  <div id="nev-cur" aria-hidden="true"></div>

  <!-- Three.js premium particle canvas (replaces leaf canvas) -->
  <canvas id="nev-three-canvas" style="position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.42;"></canvas>

  <!-- Background Leaf Canvas (Falling Leaves) -->
  <canvas id="global-leaf-canvas" style="position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.55;"></canvas>

  <div id="root" style="position: relative; z-index: 2;"></div>

<script>
  /* ══ THREE.JS PARTICLE FIELD + TORUS RINGS ══
     Emil Kowalski: animate only transform+opacity, pause when hidden
     MWG: IntersectionObserver + visibilitychange to save battery
  */
  (function initThree() {
    if (typeof THREE === 'undefined') return;
    const canvas = document.getElementById('nev-three-canvas');
    if (!canvas) return;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    cam.position.z = 80;

    /* Gold particles — 700 on desktop, 300 on mobile */
    const isMob = window.innerWidth < 768;
    const count = isMob ? 300 : 700;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      pos[i*3]   = (Math.random() - 0.5) * 240;
      pos[i*3+1] = (Math.random() - 0.5) * 240;
      pos[i*3+2] = (Math.random() - 0.5) * 120;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({
      size: isMob ? 0.4 : 0.55,
      color: 0xC9A84C, transparent: true, opacity: 0.5
    }));
    scene.add(pts);

    /* Torus rings */
    const mkRing = (r, c, rx, rz, op) => {
      const m = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.1, 8, 80),
        new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: op })
      );
      m.rotation.x = rx; m.rotation.z = rz;
      scene.add(m); return m;
    };
    const r1 = mkRing(32, 0x1B7A82, 0, 0, 0.16);
    const r2 = mkRing(20, 0xC9A84C, Math.PI/3, 0, 0.09);
    const r3 = mkRing(46, 0x23412D, Math.PI/5, Math.PI/4, 0.06);

    let mx = 0, my = 0;
    document.addEventListener('mousemove', e => {
      mx = (e.clientX / window.innerWidth - 0.5) * 2;
      my = -(e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      cam.aspect = window.innerWidth / window.innerHeight;
      cam.updateProjectionMatrix();
    }, { passive: true });

    /* MWG: pause when tab is hidden */
    let tabVisible = true;
    document.addEventListener('visibilitychange', () => {
      tabVisible = !document.hidden;
    });

    let t = 0;
    (function tick() {
      requestAnimationFrame(tick);
      if (!tabVisible) return;
      t += 0.003;
      pts.rotation.y = t * 0.07 + mx * 0.12;
      pts.rotation.x = t * 0.032 + my * 0.08;
      r1.rotation.z = t * 0.13; r1.rotation.x = t * 0.05 + my * 0.15;
      r2.rotation.z = -t * 0.09; r2.rotation.y = t * 0.1 + mx * 0.16;
      r3.rotation.y = t * 0.055; r3.rotation.z = t * 0.038 + mx * 0.07;
      renderer.render(scene, cam);
    })();
  })();

  /* ══ SPRING-LAG GOLD CURSOR ══
     Emil: spring easing for decorative mouse tracking
  */
  (function initCursor() {
    const cur  = document.getElementById('nev-cur');
    const ring = document.getElementById('nev-cur-ring');
    if (!cur || !ring) return;
    if (window.matchMedia('(hover: none)').matches) return;

    let cx = -200, cy = -200, rx = -200, ry = -200;
    document.addEventListener('mousemove', e => { cx = e.clientX; cy = e.clientY; }, { passive: true });

    (function loop() {
      requestAnimationFrame(loop);
      rx += (cx - rx) * 0.13;
      ry += (cy - ry) * 0.13;
      cur.style.left  = cx + 'px';
      cur.style.top   = cy + 'px';
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
    })();

    /* Expand ring on interactive elements */
    document.addEventListener('mouseover', e => {
      const el = e.target.closest('a, button, [role="button"]');
      if (el) ring.classList.add('hovered');
    }, { passive: true });
    document.addEventListener('mouseout', e => {
      const el = e.target.closest('a, button, [role="button"]');
      if (el) ring.classList.remove('hovered');
    }, { passive: true });
  })();
</script>

<script>
  /* ══ FALLING LEAVES BACKGROUND ANIMATION ══ */
  (function initLeaves() {
    const canvas = document.getElementById('global-leaf-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    let w = (canvas.width = window.innerWidth);
    let h = (canvas.height = window.innerHeight);
    
    window.addEventListener('resize', () => {
      w = (canvas.width = window.innerWidth);
      h = (canvas.height = window.innerHeight);
    }, { passive: true });
    
    const leaves = [];
    const leafCount = 24;
    
    for (let i = 0; i < leafCount; i++) {
      leaves.push({
        x: Math.random() * w,
        y: Math.random() * h - h,
        size: Math.random() * 0.5 + 0.35,
        vy: Math.random() * 0.8 + 0.6,
        vx: (Math.random() - 0.5) * 0.4,
        vr: (Math.random() - 0.5) * 0.015,
        rotation: Math.random() * Math.PI * 2,
        skew: Math.random() * 0.3 + 0.65,
        swaySpeed: Math.random() * 0.012 + 0.005,
        swayOffset: Math.random() * Math.PI * 2
      });
    }
    
    let scrollSpeed = 0;
    let lastScrollY = window.scrollY;
    window.addEventListener('scroll', () => {
      scrollSpeed = (window.scrollY - lastScrollY) * 0.035;
      lastScrollY = window.scrollY;
    }, { passive: true });
    
    function drawLeaf(x, y, size, rotation, skew) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(size, size * skew);
      
      let grad = ctx.createLinearGradient(-10, -20, 10, 20);
      grad.addColorStop(0, '#4E765C');
      grad.addColorStop(1, '#173020');
      ctx.fillStyle = grad;
      
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.quadraticCurveTo(-11, -5, 0, 20);
      ctx.quadraticCurveTo(11, -5, 0, -20);
      ctx.closePath();
      ctx.fill();
      
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();
      
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(0, 18);
      ctx.stroke();
      
      ctx.restore();
    }
    
    let tabVisible = true;
    document.addEventListener('visibilitychange', () => {
      tabVisible = !document.hidden;
    });
    
    function animate() {
      if (tabVisible) {
        ctx.clearRect(0, 0, w, h);
        scrollSpeed *= 0.95;
        
        leaves.forEach(leaf => {
          leaf.y += leaf.vy + scrollSpeed * 0.5;
          leaf.x += leaf.vx + Math.sin(Date.now() * leaf.swaySpeed + leaf.swayOffset) * 0.18;
          leaf.rotation += leaf.vr + scrollSpeed * 0.005;
          
          if (leaf.y > h + 30) {
            leaf.y = -40;
            leaf.x = Math.random() * w;
          }
          if (leaf.x > w + 20) leaf.x = -20;
          if (leaf.x < -20) leaf.x = w + 20;
          
          drawLeaf(leaf.x, leaf.y, leaf.size * 0.9, leaf.rotation, leaf.skew);
        });
      }
      requestAnimationFrame(animate);
    }
    
    setTimeout(animate, 200);
  })();
</script>

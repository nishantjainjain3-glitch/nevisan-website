<style>

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; background: #f9f6f0; color: #1a1a1a; overflow-x: hidden; }

  @keyframes ticker {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-12px); }
  }
  @keyframes floating-tea {
    0% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(1.5deg); }
    100% { transform: translateY(0px) rotate(0deg); }
  }
  @keyframes ripple-effect {
    0%   { transform: scale(0); opacity: 0.5; }
    100% { transform: scale(4); opacity: 0; }
  }
  @keyframes page-enter {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes gold-pulse {
    0%, 100% { text-shadow: 0 0 8px rgba(201,168,76,0.4); }
    50%       { text-shadow: 0 0 24px rgba(201,168,76,0.8); }
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #1b7a82; border-radius: 2px; }

  @keyframes menu-open {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes overlay-fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes slide-up {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  /* Glassmorphism helpers */
  .glass-panel {
    background: rgba(255, 255, 255, 0.45) !important;

    border: 1px solid rgba(201, 168, 76, 0.25) !important;

  }

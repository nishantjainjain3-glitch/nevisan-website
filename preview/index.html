<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nevisan Tea — Single Origin Assam Tea, Whole Leaf from Golaghat</title>
<meta name="description" content="Bold, wild, alive. Nevisan brings you whole leaf, chemical-free, single-origin teas from Golaghat, Assam. PGS-India certified organic. Order on WhatsApp, Amazon & Flipkart.">

<!-- Google Fonts: Playfair Display (Serif) & Inter (Sans-serif) for Official Brand Sizing -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* =========================================================
   NEVISAN TEA — OFFICIAL BRAND SYSTEM (V4 Light Redesign)
   ========================================================= */
:root {
  --primary-color:   #23412D; /* Deep Forest Green */
  --primary-dark:    #15271B;
  --primary-light:   #3D614A;
  --secondary-color: #AEC8B4; /* Soft Sage Green */
  --accent-color:    #C9A84C; /* Antique Gold */
  --bg-color:        #F8F6F2; /* Warm Off-white */
  --card-bg:         #FFFFFF;
  --text-dark:       #1F2E24;
  --text-muted:      #5C7064;
  --text-light:      #FFFFFF;
  --border-color:    #E2DDD5;

  --font-serif: 'Playfair Display', 'Georgia', serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;

  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);

  --z-nav: 100;
  --z-overlay: 10;
  --z-content: 20;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  color-scheme: light dark;
}

body {
  background-color: var(--bg-color);
  color: var(--text-dark);
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg-color); }
::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 2px; }

/* =========================================================
   ATMOSPHERIC CANVASES
   ========================================================= */
#mist-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: var(--z-overlay);
  pointer-events: none;
  mix-blend-mode: multiply;
  opacity: 0.15;
}

#global-leaf-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1; /* Behind content (z-index: 2), above body background */
  pointer-events: none;
  opacity: 0.55;
}

/* =========================================================
   NAVIGATION (Updated to Match Official Colors)
   ========================================================= */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: var(--z-nav);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.5rem 3rem;
  transition: background 0.4s var(--ease-out-expo), backdrop-filter 0.4s, border-bottom 0.4s;
}

nav.scrolled {
  background: rgba(248, 246, 242, 0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-color);
}

.nav-logo {
  font-family: var(--font-serif);
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text-light); /* Default white over dark video hero */
  text-decoration: none;
  line-height: 1;
}
nav.scrolled .nav-logo {
  color: var(--primary-color);
}
.nav-logo span { color: var(--accent-color); }

.nav-links {
  display: flex;
  align-items: center;
  gap: 2.5rem;
  list-style: none;
}

.nav-links a {
  color: rgba(255, 255, 255, 0.8);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: color 0.3s;
}
nav.scrolled .nav-links a {
  color: var(--text-muted);
}
.nav-links a:hover, nav.scrolled .nav-links a:hover {
  color: var(--accent-color);
}

.nav-cta {
  background: var(--accent-color);
  color: var(--primary-dark) !important;
  padding: 0.6rem 1.5rem;
  border-radius: var(--r-sm);
  font-weight: 700 !important;
  box-shadow: 0 4px 15px rgba(201, 168, 76, 0.2);
  transition: background 0.3s, transform 0.2s !important;
}
.nav-cta:hover {
  background: var(--primary-light) !important;
  color: var(--text-light) !important;
  transform: translateY(-1px);
}

.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px;
}
.hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--text-light);
  transition: transform 0.3s, opacity 0.3s;
}
nav.scrolled .hamburger span {
  background: var(--primary-color);
}

/* Mobile Navigation */
.mobile-nav {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(248, 246, 242, 0.98);
  backdrop-filter: blur(25px);
  z-index: 90;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
}
.mobile-nav.open { display: flex; }
.mobile-nav a {
  font-family: var(--font-serif);
  font-size: 2.2rem;
  letter-spacing: 0.05em;
  color: var(--primary-color);
  text-decoration: none;
  transition: color 0.2s;
}
.mobile-nav a:hover { color: var(--accent-color); }

/* =========================================================
   HERO SECTION (Video Background)
   ========================================================= */
.hero {
  position: relative;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8rem 2rem 4rem;
  overflow: hidden;
}

.hero-video-container {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}
.hero-video-bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.28) saturate(0.95);
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 50% 50%, transparent 15%, var(--primary-dark) 95%),
    linear-gradient(to bottom, rgba(35, 65, 45, 0.4), var(--bg-color));
  z-index: 2;
}

.hero-content {
  position: relative;
  z-index: var(--z-content);
  max-width: 900px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.625rem;
  background: rgba(201, 168, 76, 0.15);
  border: 1px solid rgba(201, 168, 76, 0.4);
  color: var(--accent-color);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 0.5rem 1.25rem;
  border-radius: 100px;
  opacity: 0;
  transform: translateY(20px);
}
.hero-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-color);
}

.hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(2.5rem, 5.5vw, 4.8rem);
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.15;
  text-wrap: balance;
  color: var(--text-light);
  opacity: 0;
  transform: translateY(40px);
}
.hero h1 em {
  font-style: normal;
  color: var(--accent-color);
}

.hero-sub {
  font-size: clamp(1rem, 2vw, 1.2rem);
  color: rgba(255, 255, 255, 0.85);
  max-width: 58ch;
  line-height: 1.65;
  text-wrap: pretty;
  opacity: 0;
  transform: translateY(20px);
}

.hero-actions {
  display: flex;
  gap: 1.5rem;
  margin-top: 1.5rem;
  opacity: 0;
  transform: translateY(20px);
}

/* Premium Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem 2.2rem;
  border-radius: var(--r-sm);
  font-weight: 700;
  font-size: 0.875rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  transition: transform 0.25s var(--ease-out-quart), box-shadow 0.25s, background-color 0.25s, color 0.25s;
  cursor: pointer;
  border: none;
  font-family: var(--font-sans);
}

.btn-primary {
  background: var(--primary-color);
  color: var(--text-light);
  box-shadow: 0 4px 20px rgba(35, 65, 45, 0.2);
  z-index: 5;
}
.btn-primary:hover {
  background: var(--accent-color);
  color: var(--primary-dark);
  box-shadow: 0 8px 30px rgba(201, 168, 76, 0.35);
  transform: translateY(-2px);
}

.btn-ghost {
  background: transparent;
  color: var(--text-light);
  border: 1px solid rgba(255, 255, 255, 0.4);
  z-index: 5;
}
.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--text-light);
  transform: translateY(-2px);
}

/* Credentials Bar */
.hero-credentials {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 3rem;
  margin-top: 4.5rem;
  width: 100%;
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  padding-top: 2rem;
  opacity: 0;
  transform: translateY(20px);
  flex-wrap: wrap;
}
.credential-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.credential-item svg {
  color: var(--accent-color);
}

.hero-scroll-hint {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  color: var(--text-muted);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0;
  animation: scroll-bob 2s ease-in-out infinite;
  z-index: var(--z-content);
}
.scroll-arrow {
  width: 1px;
  height: 35px;
  background: linear-gradient(to bottom, transparent, var(--primary-color));
  transform-origin: top;
  animation: scroll-grow 2s ease-in-out infinite;
}

/* =========================================================
   SHARED LAYOUT ELEMENTS
   ========================================================= */
section {
  position: relative;
  z-index: 2;
  overflow: hidden;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 2rem;
}

.section-pad { padding: 8rem 0; }

.section-title-wrap {
  margin-bottom: 4rem;
}
.section-title {
  font-family: var(--font-serif);
  font-size: clamp(2rem, 4vw, 3.5rem);
  font-weight: 700;
  line-height: 1.15;
  color: var(--primary-color);
  letter-spacing: 0.02em;
}
.section-title span {
  color: var(--accent-color);
  display: block;
  font-size: 0.9em;
}
.section-desc {
  font-size: 1.05rem;
  color: var(--text-muted);
  max-width: 55ch;
  line-height: 1.65;
  margin-top: 1rem;
}

.reveal {
  opacity: 0;
  transform: translateY(35px);
  transition: opacity 0.9s var(--ease-out-expo), transform 0.9s var(--ease-out-expo);
}
.reveal.visible {
  opacity: 1;
  transform: none;
}

/* =========================================================
   TICKER / RIBBON
   ========================================================= */
.ticker-band {
  background: var(--primary-color);
  border-top: 1px solid var(--border-color);
  border-bottom: 1px solid var(--border-color);
  padding: 1rem 0;
  overflow: hidden;
}
.ticker-track {
  display: flex;
  white-space: nowrap;
  animation: ticker-move 32s linear infinite;
  width: max-content;
}
.ticker-item {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  letter-spacing: 0.1em;
  color: var(--accent-color);
  padding: 0 3rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
}
.ticker-item::after {
  content: '✦';
  color: var(--secondary-color);
  font-size: 0.75rem;
}

/* =========================================================
   SENSORY MANIFESTO (Light Theme)
   ========================================================= */
.manifesto {
  background: var(--bg-color);
}
.manifesto-grid {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 6rem;
  align-items: center;
}
.manifesto-text {
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}
.manifesto-text p {
  color: var(--text-muted);
  font-size: 1.05rem;
  line-height: 1.75;
  text-wrap: pretty;
}
.manifesto-text p strong {
  color: var(--text-dark);
  font-weight: 600;
}
.manifesto-image-container {
  position: relative;
  border-radius: var(--r-lg);
  overflow: hidden;
  aspect-ratio: 4/5;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-color);
}
.manifesto-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: saturate(1.05) brightness(0.95);
  transition: transform 0.8s var(--ease-out-expo);
}
.manifesto-image-container:hover .manifesto-img {
  transform: scale(1.03);
}

/* =========================================================
   ASYMMETRIC COLLECTION (Light Theme Packaging Colors)
   ========================================================= */
.collection {
  background: var(--bg-color);
}
.collection-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 3.5rem;
}

/* Full Width Featured Product */
.card-featured {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  position: relative;
  transition: border-color 0.4s var(--ease-out-quart), box-shadow 0.4s;
}
.card-featured:hover {
  border-color: var(--secondary-color);
  box-shadow: var(--shadow-lg);
}

.featured-img-wrap {
  position: relative;
  aspect-ratio: 16/10;
  overflow: hidden;
  background: var(--bg-color);
  display: flex;
  align-items: center;
  justify-content: center;
}
.featured-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.featured-content {
  padding: 3.5rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.5rem;
}

.card-badge {
  display: inline-block;
  align-self: flex-start;
  background: rgba(35, 65, 45, 0.08);
  border: 1px solid var(--secondary-color);
  color: var(--primary-color);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.3rem 0.8rem;
  border-radius: 100px;
}

.card-title {
  font-family: var(--font-serif);
  font-size: 2.2rem;
  color: var(--primary-color);
  font-weight: 700;
  letter-spacing: 0.01em;
}

.card-desc {
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.65;
}

.tea-profile {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  border-top: 1px solid var(--border-color);
  border-bottom: 1px solid var(--border-color);
  padding: 1.25rem 0;
}
.profile-row {
  display: flex;
  font-size: 0.85rem;
}
.profile-label {
  width: 120px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 700;
}
.profile-val {
  color: var(--text-dark);
}

.card-buy-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 1rem;
}
.card-price {
  font-family: var(--font-serif);
  font-size: 1.6rem;
  color: var(--primary-color);
  font-weight: 700;
}
.card-price span {
  font-family: var(--font-sans);
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Staggered Vertical Cards */
.card-standard {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--r-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color 0.4s var(--ease-out-quart), box-shadow 0.4s;
  box-shadow: var(--shadow-sm);
}
.card-standard:hover {
  border-color: var(--secondary-color);
  box-shadow: var(--shadow-md);
}
.card-standard-img-wrap {
  aspect-ratio: 4/3;
  overflow: hidden;
  position: relative;
  background: var(--bg-color);
}
.card-standard-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card-standard-content {
  padding: 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  flex-grow: 1;
}
.card-standard .card-title {
  font-size: 1.6rem;
}

/* Horizontal card middle layout */
.card-horizontal-mid {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  transition: border-color 0.4s var(--ease-out-quart), box-shadow 0.4s;
}
.card-horizontal-mid:hover {
  border-color: var(--secondary-color);
  box-shadow: var(--shadow-lg);
}

/* =========================================================
   ORIGIN SECTION
   ========================================================= */
.origin {
  background: var(--bg-color);
  position: relative;
}
.origin-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5rem;
  align-items: center;
}
.origin-media {
  position: relative;
  border-radius: var(--r-lg);
  overflow: hidden;
  aspect-ratio: 3/4;
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-lg);
}
.origin-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.15);
}
.origin-label-card {
  position: absolute;
  bottom: 2rem;
  left: 2rem;
  background: rgba(248, 246, 242, 0.95);
  backdrop-filter: blur(15px);
  border: 1px solid var(--border-color);
  padding: 1.25rem 2rem;
  border-radius: var(--r-md);
}
.origin-loc-title {
  font-family: var(--font-serif);
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--primary-color);
  letter-spacing: 0.05em;
}
.origin-loc-sub {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-top: 0.25rem;
}

.origin-text {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.origin-text p {
  color: var(--text-muted);
  font-size: 1.05rem;
  line-height: 1.75;
}

.trust-bullets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-top: 1.5rem;
}
.bullet-card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--r-md);
  padding: 1.25rem;
  box-shadow: var(--shadow-sm);
}
.bullet-card h4 {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--primary-color);
  margin-bottom: 0.5rem;
}
.bullet-card p {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.5;
}

/* =========================================================
   BREWING RITUAL (Forest Green Committed Section)
   ========================================================= */
.brew-ritual {
  background: var(--primary-color);
  color: var(--text-light);
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.brew-ritual .section-title {
  color: var(--text-light);
}
.brew-ritual .section-desc {
  color: var(--secondary-color);
}
.ritual-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6rem;
  align-items: center;
}
.ritual-controls {
  display: flex;
  flex-direction: column;
  gap: 2.25rem;
}

.tea-select-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.75rem;
}
.tea-select-btn {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--secondary-color);
  padding: 0.75rem;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.3s;
  text-align: center;
}
.tea-select-btn.active {
  background: var(--accent-color);
  border-color: var(--accent-color);

/* =========================================================
   DAWN MIST EFFECT (Canvas Particles)
   ========================================================= */
function initMist() {
  const canvas = document.getElementById('mist-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  let w = (canvas.width = canvas.offsetWidth);
  let h = (canvas.height = canvas.offsetHeight);

  window.addEventListener('resize', () => {
    w = canvas.width = canvas.offsetWidth;
    h = canvas.height = canvas.offsetHeight;
  }, { passive: true });

  const clouds = Array.from({ length: 12 }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    vx: Math.random() * 0.15 + 0.04,
    r: Math.random() * 120 + 80,
    alpha: Math.random() * 0.08 + 0.02
  }));

  function drawMistCloud(x, y, r, alpha) {
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(201, 168, 76, ${alpha})`); // Gold mist highlight
    grad.addColorStop(0.4, `rgba(248, 246, 242, ${alpha * 0.5})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop() {
    ctx.clearRect(0, 0, w, h);
    clouds.forEach(c => {
      c.x += c.vx;
      if (c.x - c.r > w) {
        c.x = -c.r;
        c.y = Math.random() * h;
      }
      drawMistCloud(c.x, c.y, c.r, c.alpha);
    });
    requestAnimationFrame(loop);
  }

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!prefersReduced) loop();
}

/* =========================================================
   GLOBAL FLOATING BACKGROUND (Tea Leaves & Gold Spores)
   ========================================================= */
function initGlobalLeaves() {
  const canvas = document.getElementById('global-leaf-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  let w = (canvas.width = window.innerWidth);
  let h = (canvas.height = window.innerHeight);

  window.addEventListener('resize', () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }, { passive: true });

  const particlesCount = 20;
  const particles = [];

  // Generate leaves and gold blossom particles
  for (let i = 0; i < particlesCount; i++) {
    const isLeaf = i < 14;
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      size: isLeaf ? Math.random() * 20 + 12 : Math.random() * 4 + 2,
      isLeaf: isLeaf,
      // Slow drift physics
      vx: Math.random() * 0.3 + 0.1,
      vy: Math.random() * 0.4 + 0.2,
      // Rotation physics
      angle: Math.random() * Math.PI * 2,
      spinSpeed: (Math.random() - 0.5) * 0.015,
      // Simulated y-axis rotation for 3D flip effect
      angleY: Math.random() * Math.PI,
      spinSpeedY: Math.random() * 0.02 + 0.01,
      // Depth parallax
      depth: Math.random() * 0.5 + 0.3, // Opacity & speed scaler
    });
  }

  // Interactive force buffers
  let scrollDeltaY = 0;
  let mouseWindX = 0;
  let targetMouseWindX = 0;

  window.addEventListener('scroll', () => {
    scrollDeltaY = Math.min(10, Math.max(-10, window.scrollY - lastScrollY) * 0.15);
    lastScrollY = window.scrollY;
  }, { passive: true });
  let lastScrollY = window.scrollY;

  window.addEventListener('mousemove', (e) => {
    targetMouseWindX = (e.clientX / window.innerWidth - 0.5) * 1.5;
  }, { passive: true });

  // Render a detailed vector tea leaf
  function drawVectorLeaf(x, y, size, angle, angleY, depth) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(Math.sin(angleY), 1); // Simulate 3D flip on Y axis
    
    // Draw leaf shape
    ctx.beginPath();
    ctx.moveTo(0, -size);
    // Left side curve
    ctx.bezierCurveTo(-size * 0.65, -size * 0.4, -size * 0.4, size * 0.6, 0, size);
    // Right side curve
    ctx.bezierCurveTo(size * 0.4, size * 0.6, size * 0.65, -size * 0.4, 0, -size);
    
    // Fill with soft brand gradient
    const grad = ctx.createLinearGradient(0, -size, 0, size);
    grad.addColorStop(0, `rgba(174, 200, 180, ${depth * 0.3})`); // Sage Green
    grad.addColorStop(1, `rgba(35, 65, 45, ${depth * 0.25})`);   // Deep Forest Green
    ctx.fillStyle = grad;
    ctx.fill();

    // Leaf fine border
    ctx.strokeStyle = `rgba(201, 168, 76, ${depth * 0.2})`; // Antique Gold
    ctx.lineWidth = 1;
    ctx.stroke();

    // Central vein
    ctx.beginPath();
    ctx.moveTo(0, -size + 2);
    ctx.quadraticCurveTo(0, 0, 0, size - 2);
    ctx.strokeStyle = `rgba(201, 168, 76, ${depth * 0.28})`;
    ctx.stroke();

    ctx.restore();
  }

  function drawBlossom(x, y, r, depth) {
    ctx.save();
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(201, 168, 76, ${depth * 0.55})`);
    grad.addColorStop(0.5, `rgba(201, 168, 76, ${depth * 0.2})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function loop() {
    ctx.clearRect(0, 0, w, h);
    
    // Smooth input wind
    mouseWindX += (targetMouseWindX - mouseWindX) * 0.05;
    scrollDeltaY *= 0.92; // Decay scroll impulse

    particles.forEach(p => {
      // Physics updates
      p.x += (p.vx + mouseWindX) * p.depth;
      p.y += (p.vy + scrollDeltaY) * p.depth;
      p.angle += p.spinSpeed;
      p.angleY += p.spinSpeedY;

      // Wrap-around screen bounds
      if (p.y > h + 30) {
        p.y = -30;
        p.x = Math.random() * w;
      }
      if (p.y < -30) {
        p.y = h + 30;
        p.x = Math.random() * w;
      }
      if (p.x > w + 30) {
        p.x = -30;
      }
      if (p.x < -30) {
        p.x = w + 30;
      }

      if (p.isLeaf) {
        drawVectorLeaf(p.x, p.y, p.size, p.angle, p.angleY, p.depth);
      } else {
        drawBlossom(p.x, p.y, p.size, p.depth);
      }
    });

    requestAnimationFrame(loop);
  }

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!prefersReduced) loop();
}

let selectedTeaKey = 'oolong';
let activeTimer = null;
let liquidAnimFrame = null;

function selectRitualTea(key) {
  if (document.getElementById('start-brew-btn').disabled) return; // Prevent change mid-brew
  selectedTeaKey = key;
  const config = ritualTeas[key];
  
  document.querySelectorAll('.tea-select-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.toLowerCase() === key);
  });

  document.getElementById('temp-slider').value = config.temp;
  document.getElementById('time-slider').value = config.time;
  
  updateRitualParams();
  resetCup();
}

function updateRitualParams() {
  const temp = document.getElementById('temp-slider').value;
  const time = document.getElementById('time-slider').value;
  
  document.getElementById('temp-val').textContent = temp + '°C';
  document.getElementById('time-val').textContent = time + ' Min';
  
  if (!document.getElementById('start-brew-btn').disabled) {
    document.getElementById('brew-status').textContent = `Ready to steep at ${temp}°C for ${time} Min`;
  }
}

function resetCup() {
  const fill = document.getElementById('liquid-fill');
  fill.style.height = '0%';
  fill.style.backgroundColor = 'transparent';
  
  // Set leaves to resting state
  document.querySelectorAll('.liquid-leaf').forEach((leaf, idx) => {
    leaf.style.transition = 'all 1s var(--ease-out-expo)';
    leaf.style.bottom = '10px';
    leaf.style.left = (15 + idx * 25) + 'px';
    leaf.style.transform = `rotate(${(idx * 30 - 45)}deg) scale(0.9)`;
    leaf.style.opacity = '0.35';
  });
}

function startSteeping() {
  const fill = document.getElementById('liquid-fill');
  const status = document.getElementById('brew-status');
  const startBtn = document.getElementById('start-brew-btn');
  const config = ritualTeas[selectedTeaKey];
  const timeSecs = document.getElementById('time-slider').value * 4; // Simulated steep speed
  
  resetCup();
  startBtn.disabled = true;
  document.getElementById('temp-slider').disabled = true;
  document.getElementById('time-slider').disabled = true;

  // 1. Pour Phase (0 - 2.5s)
  setTimeout(() => {
    fill.style.height = '85%';
    fill.style.backgroundColor = 'rgba(255, 255, 255, 0.15)'; // Starts clear like water
  }, 100);

  let currentSec = 0;
  
  if (activeTimer) clearInterval(activeTimer);
  if (liquidAnimFrame) cancelAnimationFrame(liquidAnimFrame);

  // Active swirl during pour
  let swirlSpeed = 1;
  
  function leafLoop() {
    if (!startBtn.disabled) return;
    
    document.querySelectorAll('.liquid-leaf').forEach((leaf, idx) => {
      leaf.style.opacity = '0.85';
      const angle = (Date.now() / (300 * swirlSpeed)) + idx * (Math.PI / 3);
      
      if (swirlSpeed > 0.15) {
        // Pour swirling: highly active vertical and horizontal movement
        const x = Math.sin(angle) * 45 + 65;
        const y = Math.cos(angle * 1.5) * 40 + 70;
        const rot = angle * 50;
        leaf.style.transition = 'none';
        leaf.style.left = x + 'px';
        leaf.style.bottom = y + 'px';
        leaf.style.transform = `rotate(${rot}deg) scale(1)`;
      } else {
        // Steep settling: leaves slowly settle down
        const restY = 10 + Math.sin(Date.now() / 1000 + idx) * 4;
        const restX = (15 + idx * 25) + Math.cos(Date.now() / 1500 + idx) * 3;
        const rot = idx * 30 - 45 + Math.sin(Date.now() / 2000 + idx) * 8;
        leaf.style.transition = 'all 1.5s ease-out';
        leaf.style.left = restX + 'px';
        leaf.style.bottom = restY + 'px';
        leaf.style.transform = `rotate(${rot}deg) scale(0.95)`;
      }
    });
    
    liquidAnimFrame = requestAnimationFrame(leafLoop);
  }
  
  leafLoop();

  activeTimer = setInterval(() => {
    currentSec++;
    const progress = currentSec / timeSecs;

    // Slow down swirl speed as steeping completes
    swirlSpeed = Math.max(0.08, 1 - progress * 1.1);

    // Deepen color
    if (progress > 0.25) {
      // Interpolate water clear to final tea color
      fill.style.backgroundColor = config.color;
    }

    // Dynamic sensory captions
    const matchedStep = config.steps.find((s, idx) => {
      const next = config.steps[idx + 1];
      return progress >= s.p && (!next || progress < next.p);
    });
    if (matchedStep) {
      status.textContent = matchedStep.text;
    }

    if (currentSec >= timeSecs) {
      clearInterval(activeTimer);
      cancelAnimationFrame(liquidAnimFrame);
      status.textContent = "Infusion complete. Savor the untamed cup.";
      startBtn.disabled = false;
      document.getElementById('temp-slider').disabled = false;
      document.getElementById('time-slider').disabled = false;
      activeTimer = null;
      
      // Settle leaves flat
      document.querySelectorAll('.liquid-leaf').forEach((leaf, idx) => {
        leaf.style.transition = 'all 2s var(--ease-out-expo)';
        leaf.style.bottom = '12px';
        leaf.style.left = (15 + idx * 25) + 'px';
        leaf.style.transform = `rotate(${(idx * 40 - 80)}deg) scale(0.95)`;
        leaf.style.opacity = '0.45';
      });
    }
  }, 1000);
}

/* Brewing Steam Canvas particles */
let steamParticles = [];
function initSteam() {
  const canvas = document.getElementById('steam-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  let w = (canvas.width = canvas.offsetWidth);
  let h = (canvas.height = canvas.offsetHeight);

  window.addEventListener('resize', () => {
    w = canvas.width = canvas.offsetWidth;
    h = canvas.height = canvas.offsetHeight;
  }, { passive: true });

  function loop() {
    ctx.clearRect(0, 0, w, h);
    const tempVal = document.getElementById('temp-slider').value;
    const isSteeping = document.getElementById('start-brew-btn').disabled;
    
    // Steam intensity relative to temperature setting
    const threshold = 1 - (tempVal - 70) / 60; // 0 (hot) to 0.5 (cool)
    
    if (isSteeping && Math.random() > Math.min(0.85, 0.4 + threshold)) {
      steamParticles.push({
        x: w / 2 + (Math.random() - 0.5) * 100,
        y: h - 10,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -(Math.random() * 0.6 + 0.3 + (tempVal - 70) * 0.01),
        r: Math.random() * 6 + 3,
        alpha: Math.random() * 0.15 + 0.08
      });
    }

    steamParticles.forEach((p, idx) => {
      p.x += p.vx;
      p.y += p.vy;
      p.r += 0.08;
      p.alpha -= 0.003;
      
      if (p.alpha <= 0 || p.y < 0) {
        steamParticles.splice(idx, 1);
        return;
      }
      
      ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    });
    
    requestAnimationFrame(loop);
  }
  loop();
}

/* =========================================================
   SCROLL INTERACTION & PARALLAX
   ========================================================= */
function initNav() {
  const nav = document.getElementById('main-nav');
  const hamburger = document.getElementById('hamburger-btn');
  const mobileNav = document.getElementById('mobile-nav');

  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 50);
  }, { passive: true });

  hamburger.addEventListener('click', () => {
    const open = mobileNav.classList.toggle('open');
    hamburger.setAttribute('aria-expanded', open);
  });

  mobileNav.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      mobileNav.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
    });
  });
}

function initParallax() {
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) return;

  gsap.registerPlugin(ScrollTrigger);

  // Parallax Scroll for Origin Sunrise Image
  gsap.to("#parallax-origin-img", {
    yPercent: -15,
    ease: "none",
    scrollTrigger: {
      trigger: ".origin-media",
      start: "top bottom",
      end: "bottom top",
      scrub: true
    }
  });

  // Entrance animations for Hero
  const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
  tl.to('#hero-badge', { opacity: 1, y: 0, duration: 1 }, 0.2)
    .to('#hero-heading', { opacity: 1, y: 0, duration: 1.2 }, 0.4)
    .to('#hero-sub', { opacity: 1, y: 0, duration: 1 }, 0.7)
    .to('#hero-actions', { opacity: 1, y: 0, duration: 0.8 }, 0.9)
    .to('#hero-credentials', { opacity: 1, y: 0, duration: 0.8 }, 1.1)
    .to('#hero-scroll', { opacity: 1, duration: 0.8 }, 1.5);
}

function initScrollReveal() {
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
    return;
  }

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}

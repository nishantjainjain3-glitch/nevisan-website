<!-- Google Fonts: Playfair Display (Serif) & Inter (Sans-serif) for Official Brand Sizing -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* =========================================================
   NEVISAN TEA â€” OFFICIAL BRAND SYSTEM (V5 Light Redesign)
   ========================================================= */
:root {
  --primary-color:   #23412D; /* Deep Forest Green */
  --primary-dark:    #15271B;
  --primary-light:   #3D614A;
  --secondary-color: #AEC8B4; /* Soft Sage Green */
  --accent-color:    #C9A84C; /* Antique Gold */
  --bg-color:        #F8F6F2; /* Warm Off-white */
  --card-bg:         #FFFFFF;
  --text-dark:       #1F2E24;
  --text-muted:      #5C7064;
  --text-light:      #FFFFFF;
  --border-color:    #E2DDD5;

  --font-serif: 'Playfair Display', 'Georgia', serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;

  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);

  --z-nav: 100;
  --z-overlay: 10;
  --z-content: 20;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  color-scheme: light dark;
}

body {
  background-color: var(--bg-color);
  color: var(--text-dark);
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg-color); }
::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 2px; }

/* =========================================================
   ATMOSPHERIC CANVASES
   ========================================================= */
#mist-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: var(--z-overlay);
  pointer-events: none;
  mix-blend-mode: multiply;
  opacity: 0.15;
}

#global-leaf-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1; /* Behind content (z-index: 2), above body background */
  pointer-events: none;
  opacity: 0.75;
}

/* =========================================================
   NAVIGATION (Updated to Match Official Colors)
   ========================================================= */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: var(--z-nav);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.5rem 3rem;
  transition: background 0.4s var(--ease-out-expo), backdrop-filter 0.4s, border-bottom 0.4s;
}

nav.scrolled {
  background: rgba(248, 246, 242, 0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-color);
}

.nav-logo {
  font-family: var(--font-serif);
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text-light); /* Default white over dark video hero */
  text-decoration: none;
  line-height: 1;
}
nav.scrolled .nav-logo {
  color: var(--primary-color);
}
.nav-logo span { color: var(--accent-color); }

.nav-links {
  display: flex;
  align-items: center;
  gap: 2.5rem;
  list-style: none;
}

.nav-links a {
  color: rgba(255, 255, 255, 0.8);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: color 0.3s;
}
nav.scrolled .nav-links a {
  color: var(--text-muted);
}
.nav-links a:hover, nav.scrolled .nav-links a:hover {
  color: var(--accent-color);
}

.nav-cta {
  background: var(--accent-color);
  color: var(--primary-dark) !important;
  padding: 0.6rem 1.5rem;
  border-radius: var(--r-sm);
  font-weight: 700 !important;
  box-shadow: 0 4px 15px rgba(201, 168, 76, 0.2);
  transition: background 0.3s, transform 0.2s !important;
}
.nav-cta:hover {
  background: var(--primary-light) !important;
  color: var(--text-light) !important;
  transform: translateY(-1px);
}

.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px;
}
.hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--text-light);
  transition: transform 0.3s, opacity 0.3s;
}
nav.scrolled .hamburger span {
  background: var(--primary-color);
}

/* Mobile Navigation */
.mobile-nav {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(248, 246, 242, 0.98);
  backdrop-filter: blur(25px);
  z-index: 90;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
}
.mobile-nav.open { display: flex; }
.mobile-nav a {
  font-family: var(--font-serif);
  font-size: 2.2rem;
  letter-spacing: 0.05em;
  color: var(--primary-color);
  text-decoration: none;
  transition: color 0.2s;
}
.mobile-nav a:hover { color: var(--accent-color); }

/* =========================================================
   HERO SECTION (Video Background)
   ========================================================= */
.hero {
  position: relative;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8rem 2rem 4rem;
  overflow: hidden;
}

.hero-video-container {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}
.hero-video-bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.28) saturate(0.95);
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 50% 50%, transparent 15%, var(--primary-dark) 95%),
    linear-gradient(to bottom, rgba(35, 65, 45, 0.4), var(--bg-color));
  z-index: 2;
}

.hero-content {
  position: relative;
  z-index: var(--z-content);
  max-width: 900px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.625rem;
  background: rgba(201, 168, 76, 0.15);
  border: 1px solid rgba(201, 168, 76, 0.4);
  color: var(--accent-color);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 0.5rem 1.25rem;
  border-radius: 100px;
  opacity: 0;
  transform: translateY(20px);
}
.hero-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-color);
}

.hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(2.5rem, 5.5vw, 4.8rem);
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.15;
  text-wrap: balance;
  color: var(--text-light);
  opacity: 0;
  transform: translateY(40px);
}
.hero h1 em {
  font-style: normal;
  color: var(--accent-color);
}

.hero-sub {
  font-size: clamp(1rem, 2vw, 1.2rem);
  color: rgba(255, 255, 255, 0.85);
  max-width: 58ch;
  line-height: 1.65;
  text-wrap: pretty;
  opacity: 0;
  transform: translateY(20px);
}

.hero-actions {
  display: flex;
  gap: 1.5rem;
  margin-top: 1.5rem;
  opacity: 0;
  transform: translateY(20px);
}

/* Premium Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem 2.2rem;
  border-radius: var(--r-sm);
  font-weight: 700;
  font-size: 0.875rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  transition: transform 0.25s var(--ease-out-quart), box-shadow 0.25s, background-color 0.25s, color 0.25s;
  cursor: pointer;
  border: none;
  font-family: var(--font-sans);
}

.btn-primary {
  background: var(--primary-color);
  color: var(--text-light);
  box-shadow: 0 4px 20px rgba(35, 65, 45, 0.2);
  z-index: 5;
}
.btn-primary:hover {
  background: var(--accent-color);
  color: var(--primary-dark);
  box-shadow: 0 8px 30px rgba(201, 168, 76, 0.35);
  transform: translateY(-2px);
}

.btn-ghost {
  background: transparent;
  color: var(--text-light);
  border: 1px solid rgba(255, 255, 255, 0.4);
  z-index: 5;
}
.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--text-light);
  transform: translateY(-2px);
}

/* Credentials Bar */
.hero-credentials {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 3rem;
  margin-top: 4.5rem;
  width: 100%;
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  padding-top: 2rem;
  opacity: 0;
  transform: translateY(20px);
  flex-wrap: wrap;
}
.credential-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.credential-item svg {
  color: var(--accent-color);
}

.hero-scroll-hint {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  color: var(--text-muted);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0;
  animation: scroll-bob 2s ease-in-out infinite;
  z-index: var(--z-content);
}
.scroll-arrow {
  width: 1px;
  height: 35px;
  background: linear-gradient(to bottom, transparent, var(--primary-color));
  transform-origin: top;
  animation: scroll-grow 2s ease-in-out infinite;
}

/* =========================================================
   SHARED LAYOUT ELEMENTS
   ========================================================= */
section {
  position: relative;
  z-index: 2;
  overflow: hidden;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 2rem;
}

.section-pad { padding: 8rem 0; }

.section-title-wrap {
  margin-bottom: 4rem;
}
.section-title {
  font-family: var(--font-serif);
  font-size: clamp(2rem, 4vw, 3.5rem);
  font-weight: 700;
  line-height: 1.15;
  color: var(--primary-color);
  letter-spacing: 0.02em;
}
.section-title span {
  color: var(--accent-color);
  display: block;
  font-size: 0.9em;
}
.section-desc {
  font-size: 1.05rem;
  color: var(--text-muted);
  max-width: 55ch;
  line-height: 1.65;
  margin-top: 1rem;
}

.reveal {
  opacity: 0;
  transform: translateY(35px);
  transition: opacity 0.9s var(--ease-out-expo), transform 0.9s var(--ease-out-expo);
}
.reveal.visible {
  opacity: 1;
  transform: none;
}

/* =========================================================
   TICKER / RIBBON
   ========================================================= */
.ticker-band {
  background: var(--primary-color);
  border-top: 1px solid var(--border-color);
  border-bottom: 1px solid var(--border-color);
  padding: 1rem 0;
  overflow: hidden;
}
.ticker-track {
  display: flex;
  white-space: nowrap;
  animation: ticker-move 32s linear infinite;
  width: max-content;
}
.ticker-item {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  letter-spacing: 0.1em;
  color: var(--accent-color);
  padding: 0 3rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
}
.ticker-item::after {
  content: 'âœ¦';
  color: var(--secondary-color);
  font-size: 0.75rem;
}

/* =========================================================
   SENSORY MANIFESTO (Light Theme)
   ========================================================= */
.manifesto {
  background: var(--bg-color);
}
.manifesto-grid {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 6rem;
  align-items: center;
}
.manifesto-text {
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}
.manifesto-text p {
  color: var(--text-muted);
  font-size: 1.05rem;
  line-height: 1.75;
  text-wrap: pretty;
}
.manifesto-text p strong {
  color: var(--text-dark);
  font-weight: 600;
}
.manifesto-image-container {
  position: relative;
  border-radius: var(--r-lg);
  overflow: hidden;
  aspect-ratio: 4/5;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-color);
}
.manifesto-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: saturate(1.05) brightness(0.95);
  transition: transform 0.8s var(--ease-out-expo);
}
.manifesto-image-container:hover .manifesto-img {
  transform: scale(1.03);
}

/* =========================================================
   ASYMMETRIC COLLECTION (Light Theme Packaging Colors)
   ========================================================= */
.collection {
  background: var(--bg-color);
}
.collection-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 3.5rem;
}

/* Full Width Featured Product */
.card-featured {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  position: relative;
  transition: border-color 0.4s var(--ease-out-quart), box-shadow 0.4s;
}
.card-featured:hover {
  border-color: var(--secondary-color);
  box-shadow: var(--shadow-lg);
}

.featured-img-wrap {
  position: relative;
  aspect-ratio: 16/10;
  overflow: hidden;
  background: var(--bg-color);
  display: flex;
  align-items: center;
  justify-content: center;
}
.featured-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.featured-content {
  padding: 3.5rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.5rem;
}

.card-badge {
  display: inline-block;
  align-self: flex-start;
  background: rgba(35, 65, 45, 0.08);
  border: 1px solid var(--secondary-color);
  color: var(--primary-color);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.3rem 0.8rem;
  border-radius: 100px;
}

.card-title {
  font-family: var(--font-serif);
  font-size: 2.2rem;
  color: var(--primary-color);
  font-weight: 700;
  letter-spacing: 0.01em;
}

.card-desc {
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.65;
}

.tea-profile {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  border-top: 1px solid var(--border-color);
  border-bottom: 1px solid var(--border-color);
  padding: 1.25rem 0;
}
.profile-row {
  display: flex;
  font-size: 0.85rem;
}
.profile-label {
  width: 120px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 700;
}
.profile-val {
  color: var(--text-dark);
}

.card-buy-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 1rem;
}
.card-price {
  font-family: var(--font-serif);
  font-size: 1.6rem;
  color: var(--primary-color);
  font-weight: 700;
}
.card-price span {
  font-family: var(--font-sans);
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Staggered Vertical Cards */
.card-standard {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--r-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color 0.4s var(--ease-out-quart), box-shadow 0.4s;
  box-shadow: var(--shadow-sm);
}
.card-standard:hover {
  border-color: var(--secondary-color);
  box-shadow: var(--shadow-md);
}
.card-standard-img-wrap {
  aspect-ratio: 4/3;
  overflow: hidden;
  position: relative;
  background: var(--bg-color);
}
.card-standard-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card-standard-content {
  padding: 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  flex-grow: 1;
}
.card-standard .card-title {
  font-size: 1.6rem;
}

/* Horizontal card middle layout */
.card-horizontal-mid {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  transition: border-color 0.4s var(--ease-out-quart), box-shadow 0.4s;
}
.card-horizontal-mid:hover {
  border-color: var(--secondary-color);
  box-shadow: var(--shadow-lg);
}

/* =========================================================
   ORIGIN SECTION
   ========================================================= */
.origin {
  background: var(--bg-color);
  position: relative;
}
.origin-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5rem;
  align-items: center;
}
.origin-media {
  position: relative;
  border-radius: var(--r-lg);
  overflow: hidden;
  aspect-ratio: 3/4;
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-lg);
}
.origin-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.15);
}
.origin-label-card {
  position: absolute;
  bottom: 2rem;
  left: 2rem;
  background: rgba(248, 246, 242, 0.95);
  backdrop-filter: blur(15px);
  border: 1px solid var(--border-color);
  padding: 1.25rem 2rem;
  border-radius: var(--r-md);
}
.origin-loc-title {
  font-family: var(--font-serif);
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--primary-color);
  letter-spacing: 0.05em;
}
.origin-loc-sub {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-top: 0.25rem;
}

.origin-text {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.origin-text p {
  color: var(--text-muted);
  font-size: 1.05rem;
  line-height: 1.75;
}

.trust-bullets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-top: 1.5rem;
}
.bullet-card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--r-md);
  padding: 1.25rem;
  box-shadow: var(--shadow-sm);
}
.bullet-card h4 {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--primary-color);
  margin-bottom: 0.5rem;
}
.bullet-card p {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.5;
}

/* =========================================================
   BREWING RITUAL (Forest Green Committed Section)
   ========================================================= */
.brew-ritual {
  background: var(--primary-color);
  color: var(--text-light);
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.brew-ritual .section-title {
  color: var(--text-light);
}
.brew-ritual .section-desc {
  color: var(--secondary-color);
}
.ritual-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6rem;
  align-items: center;
}
.ritual-controls {
  display: flex;
  flex-direction: column;
  gap: 2.25rem;
}

.tea-select-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.75rem;
}
.tea-select-btn {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--secondary-color);
  padding: 0.75rem;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.3s;
  text-align: center;
}
.tea-select-btn.active {
  background: var(--accent-color);
  border-color: var(--accent-color);
  color: var(--primary-dark);
  box-shadow: 0 4px 15px rgba(201, 168, 76, 0.3);
}

.slider-container {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.slider-label-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.875rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.slider-label-row span:last-child {
  color: var(--accent-color);
}
.brew-range {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 2px;
  outline: none;
}
.brew-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent-color);
  cursor: pointer;
  box-shadow: 0 0 10px var(--accent-color);
  transition: transform 0.2s;
}

.ritual-visual {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 2rem;
  background: var(--primary-dark);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: var(--r-lg);
  box-shadow: inset 0 4px 20px rgba(0,0,0,0.3);
}

/* Double-Walled Glass Mug Design */
.mug-container {
  position: relative;
  width: 160px;
  height: 200px;
  margin-top: 40px;
}
/* Outer Wall */
.glass-mug-outline {
  position: absolute;
  inset: 0;
  border: 4px solid rgba(255, 255, 255, 0.85);
  border-top: none;
  border-bottom-left-radius: 28px;
  border-bottom-right-radius: 28px;
  z-index: 5;
  pointer-events: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
/* Inner Wall (Double wall visual) */
.glass-mug-inner-wall {
  position: absolute;
  top: 0; bottom: 8px; left: 8px; right: 8px;
  border: 2px solid rgba(255, 255, 255, 0.4);
  border-top: none;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
  z-index: 4;
  pointer-events: none;
}
/* Gold Handle */
.glass-mug-handle {
  position: absolute;
  right: -36px;
  top: 40px;
  width: 36px;
  height: 100px;
  border: 4px solid var(--accent-color);
  border-left: none;
  border-top-right-radius: 35px;
  border-bottom-right-radius: 35px;
  z-index: 3;
  pointer-events: none;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
}
/* Liquid Wave Fill */
.tea-liquid-fill {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 10px;
  height: 0%; /* Dynamic fill */
  background: transparent;
  border-bottom-left-radius: 18px;
  border-bottom-right-radius: 18px;
  z-index: 2;
  transition: height 2.5s cubic-bezier(0.4, 0, 0.2, 1), background-color 2.5s ease-in-out;
  overflow: hidden;
}

/* Floating leaf animations inside mug */
.liquid-leaf {
  position: absolute;
  width: 12px;
  height: 18px;
  background: var(--secondary-color);
  border-radius: 50% 0 50% 0;
  opacity: 0.7;
  pointer-events: none;
  transform-origin: center;
  transition: transform 0.5s ease-out, bottom 0.5s ease-out, left 0.5s ease-out;
}

/* Canvas Steam above Mug */
#steam-canvas {
  width: 160px;
  height: 80px;
  position: absolute;
  top: -40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
}

/* Parameter summary */
.brew-status-text {
  text-align: center;
  font-family: var(--font-serif);
  font-size: 1.25rem;
  color: var(--accent-color);
  margin-top: 1.5rem;
  min-height: 3rem;
  max-width: 320px;
  line-height: 1.4;
}

/* =========================================================
   VERIFIABLE TRUST / CERTIFICATIONS
   ========================================================= */
.trust-seals {
  background: var(--bg-color);
}
.seals-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4rem;
}
.seal-card {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.25rem;
}
.seal-icon-box {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary-color);
  box-shadow: var(--shadow-sm);
}
.seal-card h3 {
  font-family: var(--font-serif);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--primary-color);
  letter-spacing: 0.02em;
}
.seal-card p {
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.6;
}

/* =========================================================
   THE GUESTBOOK (Testimonials in Light Theme)
   ========================================================= */
.testimonials {
  background: var(--bg-color);
  border-top: 1px solid var(--border-color);
}
.guestbook-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2rem;
  margin-top: 4rem;
}
.guestbook-card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--r-lg);
  padding: 2.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  box-shadow: var(--shadow-sm);
}
.guestbook-card .stars {
  color: var(--accent-color);
  font-size: 0.85rem;
  display: flex;
  gap: 3px;
}
.guestbook-text {
  font-size: 0.95rem;
  color: var(--text-dark);
  line-height: 1.65;
  font-style: italic;
  flex-grow: 1;
}
.guestbook-user {
  display: flex;
  align-items: center;
  gap: 1rem;
  border-top: 1px solid var(--border-color);
  padding-top: 1.25rem;
}
.guestbook-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg-color);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 1rem;
  font-weight: 700;
  color: var(--primary-color);
  border: 1px solid var(--border-color);
}
.guestbook-name {
  font-size: 0.85rem;
  font-weight: 700;
}
.guestbook-meta {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* =========================================================
   CTA BANNER (Drenched)
   ========================================================= */
.cta-banner {
  background: 
    radial-gradient(circle at 50% 50%, rgba(35, 65, 45, 0.85), var(--primary-dark) 95%),
    url('../collection-bg.jpg') center/cover no-repeat;
  text-align: center;
  padding: 9rem 2rem;
  border-bottom: 1px solid var(--border-color);
}
.cta-banner-content {
  max-width: 700px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;

  gap: 1.5rem;
}
.cta-banner h2 {
  font-family: var(--font-serif);
  font-size: clamp(2.5rem, 5vw, 4rem);
  font-weight: 700;
  color: var(--text-light);
  line-height: 1.15;
}
.cta-banner h2 em {
  font-style: normal;
  color: var(--accent-color);
}
.cta-banner p {
  color: var(--secondary-color);
  font-size: 1.1rem;
  line-height: 1.6;
  margin-bottom: 1rem;
}

/* =========================================================
   FOOTER (Deep Forest Green)
   ========================================================= */
footer {
  background: var(--primary-dark);
  padding: 5rem 0 2.5rem;
  color: var(--secondary-color);
}
.footer-grid {

}
.footer-brand {

}
.footer-logo {

  font-size: 2.2rem;
  font-weight: 700;
  color: var(--text-light);
  letter-spacing: 0.08em;

}
.footer-logo span { color: var(--accent-color); }
.footer-desc {
  font-size: 0.875rem;
  line-height: 1.6;
  max-width: 38ch;
}
.footer-socials {
  display: flex;
  gap: 1rem;
}
.footer-socials a {
  width: 38px;
  height: 38px;
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);

  align-items: center;

  color: var(--secondary-color);

}
.footer-socials a:hover {
  border-color: var(--accent-color);
  color: var(--accent-color);
}
.footer-col h4 {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  color: var(--text-light);
  letter-spacing: 0.1em;

}
.footer-links {

}
.footer-links a {

}

.footer-bottom {
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1.5rem;
}
.footer-copy {
  font-size: 0.8rem;
}
.footer-legal {
  display: flex;
  gap: 2rem;
}
.footer-legal a {
  font-size: 0.8rem;
  color: var(--secondary-color);
  text-decoration: none;
}
.footer-legal a:hover { color: var(--text-light); }

/* Overrides to ensure React page wrappers are transparent and let canvases show through */
#root, .app-container {
  background: transparent !important;
}
</style>

<body>

<div id="root"></div>

<!-- Background Atmospheric Canvases -->
<canvas id="mist-canvas" aria-hidden="true"></canvas>
<canvas id="global-leaf-canvas" aria-hidden="true"></canvas>

<!-- ====================== SCRIPTS ====================== -->
<!-- React Production Bundles -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<!-- GSAP Animations -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
/* =========================================================
   DAWN MIST EFFECT (Canvas Particles)
   ========================================================= */
function initMist() {
  const canvas = document.getElementById('mist-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  let w = (canvas.width = canvas.offsetWidth);
  let h = (canvas.height = canvas.offsetHeight);

  window.addEventListener('resize', () => {
    w = canvas.width = canvas.offsetWidth;
    h = canvas.height = canvas.offsetHeight;
  }, { passive: true });

  const clouds = Array.from({ length: 12 }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    vx: Math.random() * 0.15 + 0.04,
    r: Math.random() * 120 + 80,
    alpha: Math.random() * 0.08 + 0.02
  }));

  function drawMistCloud(x, y, r, alpha) {
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(201, 168, 76, ${alpha})`); // Gold mist highlight
    grad.addColorStop(0.4, `rgba(248, 246, 242, ${alpha * 0.5})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop() {
    ctx.clearRect(0, 0, w, h);
    clouds.forEach(c => {
      c.x += c.vx;
      if (c.x - c.r > w) {
        c.x = -c.r;
        c.y = Math.random() * h;
      }
      drawMistCloud(c.x, c.y, c.r, c.alpha);
    });
    requestAnimationFrame(loop);
  }

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!prefersReduced) loop();
}

/* =========================================================
   GLOBAL FLOATING BACKGROUND (Tea Garden Ecosystem)
   ========================================================= */
function initGlobalLeaves() {
  const canvas = document.getElementById('global-leaf-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  let w = (canvas.width = window.innerWidth);
  let h = (canvas.height = window.innerHeight);

  window.addEventListener('resize', () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }, { passive: true });

  const particles = [];
  const leafCount = 10;
  const butterflyCount = 3;
  const fireflyCount = 12;
  const dewCount = 6;

  // Initialize leaves
  for (let i = 0; i < leafCount; i++) {
    particles.push({
      type: 'leaf',
      x: Math.random() * w,
      y: Math.random() * h,
      size: Math.random() * 20 + 12,
      vx: Math.random() * 0.2 + 0.1,
      vy: Math.random() * 0.3 + 0.2,
      angle: Math.random() * Math.PI * 2,
      spinSpeed: (Math.random() - 0.5) * 0.015,
      angleY: Math.random() * Math.PI,
      spinSpeedY: Math.random() * 0.02 + 0.01,
      depth: Math.random() * 0.5 + 0.3,
    });
  }

  // Initialize butterflies (Culture / Life)
  for (let i = 0; i < butterflyCount; i++) {
    particles.push({
      type: 'butterfly',
      x: Math.random() * w,
      y: Math.random() * h,
      size: Math.random() * 12 + 10,
      vx: Math.random() * 0.4 + 0.2,
      vy: (Math.random() - 0.5) * 0.2 - 0.1,
      angle: Math.random() * Math.PI * 2,
      depth: Math.random() * 0.4 + 0.5,
      flapOffset: Math.random() * 100,
    });
  }

  // Initialize fireflies (glowing organic spores)
  for (let i = 0; i < fireflyCount; i++) {
    particles.push({
      type: 'firefly',
      x: Math.random() * w,
      y: Math.random() * h,
      size: Math.random() * 5 + 3,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3 - 0.1,
      depth: Math.random() * 0.5 + 0.4,
      pulseOffset: Math.random() * 100,
    });
  }

  // Initialize dew droplets (terroir dew)
  for (let i = 0; i < dewCount; i++) {
    particles.push({
      type: 'dew',
      x: Math.random() * w,
      y: Math.random() * h,
      size: Math.random() * 3 + 1.5,
      vx: 0.05,
      vy: Math.random() * 0.6 + 0.4,
      depth: Math.random() * 0.4 + 0.3,
    });
  }

  // Interactive Wind & Scroll Forces
  let scrollDeltaY = 0;
  let mouseWindX = 0;
  let targetMouseWindX = 0;

  window.addEventListener('scroll', () => {
    scrollDeltaY = Math.min(10, Math.max(-10, window.scrollY - lastScrollY) * 0.15);
    lastScrollY = window.scrollY;
  }, { passive: true });
  let lastScrollY = window.scrollY;

  window.addEventListener('mousemove', (e) => {
    targetMouseWindX = (e.clientX / window.innerWidth - 0.5) * 1.5;
  }, { passive: true });

  // Draw organic vector tea leaves
  function drawVectorLeaf(x, y, size, angle, angleY, depth) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(Math.sin(angleY), 1); // 3D spin simulation
    
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.bezierCurveTo(-size * 0.65, -size * 0.4, -size * 0.4, size * 0.6, 0, size);
    ctx.bezierCurveTo(size * 0.4, size * 0.6, size * 0.65, -size * 0.4, 0, -size);
    
    const grad = ctx.createLinearGradient(0, -size, 0, size);
    grad.addColorStop(0, `rgba(174, 200, 180, ${depth * 0.28})`); // Sage Green
    grad.addColorStop(1, `rgba(35, 65, 45, ${depth * 0.22})`);   // Deep Forest Green
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = `rgba(201, 168, 76, ${depth * 0.18})`; // Antique Gold outline
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -size + 2);
    ctx.quadraticCurveTo(0, 0, 0, size - 2);
    ctx.strokeStyle = `rgba(201, 168, 76, ${depth * 0.25})`;
    ctx.stroke();

    ctx.restore();
  }

  // Draw golden fluttering butterflies
  function drawButterfly(x, y, size, depth, flapOffset) {
    ctx.save();
    ctx.translate(x, y);
    
    const bob = Math.sin(Date.now() / 200 + flapOffset) * 4;
    ctx.translate(0, bob);

    const wingFlap = Math.abs(Math.sin(Date.now() / 80 + flapOffset));
    
    // Left Wing
    ctx.save();
    ctx.scale(wingFlap, 1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-size * 0.8, -size * 0.8, -size * 0.9, -size * 0.2, 0, -size * 0.1);
    ctx.bezierCurveTo(-size * 0.7, 0, -size * 0.5, size * 0.6, 0, size * 0.3);
    ctx.fillStyle = `rgba(201, 168, 76, ${depth * 0.35})`; // Gold
    ctx.fill();
    ctx.strokeStyle = `rgba(35, 65, 45, ${depth * 0.25})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.restore();

    // Right Wing
    ctx.save();
    ctx.scale(-wingFlap, 1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-size * 0.8, -size * 0.8, -size * 0.9, -size * 0.2, 0, -size * 0.1);
    ctx.bezierCurveTo(-size * 0.7, 0, -size * 0.5, size * 0.6, 0, size * 0.3);
    ctx.fillStyle = `rgba(201, 168, 76, ${depth * 0.35})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(35, 65, 45, ${depth * 0.25})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.restore();

    // Body
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.5);
    ctx.lineTo(0, size * 0.4);
    ctx.strokeStyle = `rgba(35, 65, 45, ${depth * 0.4})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  // Draw glowing fireflies
  function drawFirefly(x, y, r, depth, pulseOffset) {
    ctx.save();
    const pulse = (Math.cos(Date.now() / 600 + pulseOffset) + 1) / 2;
    const finalAlpha = depth * (0.15 + pulse * 0.5);
    const sizeFactor = 1 + pulse * 0.4;
    
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r * sizeFactor);
    grad.addColorStop(0, `rgba(201, 168, 76, ${finalAlpha})`); 
    grad.addColorStop(0.4, `rgba(201, 168, 76, ${finalAlpha * 0.3})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r * sizeFactor, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Draw clean dew drops
  function drawDew(x, y, size, depth) {
    ctx.save();
    ctx.fillStyle = `rgba(174, 200, 180, ${depth * 0.22})`; // Translucent Sage Green
    ctx.beginPath();
    ctx.moveTo(x, y - size);
    ctx.bezierCurveTo(x - size * 0.7, y + size * 0.3, x - size * 0.4, y + size, x, y + size);
    ctx.bezierCurveTo(x + size * 0.4, y + size, x + size * 0.7, y + size * 0.3, x, y - size);
    ctx.fill();
    ctx.restore();
  }

  function loop() {
    ctx.clearRect(0, 0, w, h);
    
    mouseWindX += (targetMouseWindX - mouseWindX) * 0.05;
    scrollDeltaY *= 0.92;

    particles.forEach(p => {
      if (p.type === 'leaf') {
        p.x += (p.vx + mouseWindX) * p.depth;
        p.y += (p.vy + scrollDeltaY) * p.depth;
        p.angle += p.spinSpeed;
        p.angleY += p.spinSpeedY;
        drawVectorLeaf(p.x, p.y, p.size, p.angle, p.angleY, p.depth);
      } 
      else if (p.type === 'butterfly') {
        const sway = Math.sin(Date.now() / 400 + p.flapOffset) * 0.5;
        p.x += (p.vx + mouseWindX + sway) * p.depth;
        p.y += (p.vy + scrollDeltaY * 0.5) * p.depth;
        drawButterfly(p.x, p.y, p.size, p.depth, p.flapOffset);
      } 
      else if (p.type === 'firefly') {
        const wanderX = Math.sin(Date.now() / 800 + p.pulseOffset) * 0.2;
        const wanderY = Math.cos(Date.now() / 700 + p.pulseOffset) * 0.15;
        p.x += (p.vx + mouseWindX * 0.3 + wanderX) * p.depth;
        p.y += (p.vy + scrollDeltaY * 0.2 + wanderY) * p.depth;
        drawFirefly(p.x, p.y, p.size, p.depth, p.pulseOffset);
      } 
      else if (p.type === 'dew') {
        p.x += (p.vx + mouseWindX * 0.15) * p.depth;
        p.y += (p.vy + scrollDeltaY * 1.5) * p.depth;
        drawDew(p.x, p.y, p.size, p.depth);
      }

      // Wrapping bounds
      if (p.y > h + 40) {
        p.y = -40;
        p.x = Math.random() * w;
      }
      if (p.y < -40) {
        p.y = h + 40;
        p.x = Math.random() * w;
      }
      if (p.x > w + 40) {
        p.x = -40;
      }
      if (p.x < -40) {
        p.x = w + 40;
      }
    });

    requestAnimationFrame(loop);
  }

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!prefersReduced) loop();
}

/* =========================================================
   DOM CONTENT INITIALIZATION
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  initMist();
  initGlobalLeaves();
});
</script>

<!-- Main React Application Entry -->
<script src="app.js"></script>

</body>

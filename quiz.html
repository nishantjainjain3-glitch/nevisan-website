<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Perfect Tea — Nevisan</title>
<meta name="description" content="Answer 4 quick questions and discover which Nevisan whole-leaf Assam tea is perfect for you — from GABA Oolong for sleep to Spearmint for hormonal balance.">
<link rel="canonical" href="https://nevisan.in/quiz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --teal:#1b7a82; --teal-dark:#0f3f45; --gold:#c9a84c;
    --cream:#f9f6f0; --cream-dark:#f2ede4; --text:#1a1a1a; --muted:#5a6a6b; --border:#e8e0d0;
  }
  body{ font-family:'Inter',sans-serif; background:var(--cream); color:var(--text); line-height:1.6; min-height:100vh; }

  nav{ background:var(--teal-dark); padding:0 32px; display:flex; align-items:center; justify-content:space-between; height:60px; position:sticky; top:0; z-index:100; }
  .nav-logo{ color:#fff; font-family:'Playfair Display',Georgia,serif; font-size:20px; letter-spacing:0.08em; text-decoration:none; }
  .nav-shop{ background:var(--gold); color:var(--teal-dark); padding:8px 20px; border-radius:6px; font-size:13px; font-weight:600; text-decoration:none; letter-spacing:0.04em; }

  .wrap{ max-width:640px; margin:0 auto; padding:40px 24px 80px; }

  /* INTRO */
  .intro{ text-align:center; padding-top:24px; animation:fade .5s ease both; }
  .intro .kicker{ display:inline-block; font-size:11px; letter-spacing:0.16em; color:var(--gold); background:rgba(201,168,76,0.12); padding:6px 16px; border-radius:99px; margin-bottom:20px; }
  .intro h1{ font-family:'Playfair Display',serif; font-weight:400; font-size:clamp(30px,6vw,46px); line-height:1.15; color:var(--teal-dark); margin-bottom:16px; }
  .intro p{ color:var(--muted); font-size:16px; max-width:460px; margin:0 auto 32px; }

  /* PROGRESS */
  .progress-shell{ height:6px; background:var(--cream-dark); border-radius:99px; overflow:hidden; margin-bottom:8px; }
  .progress-bar{ height:100%; width:0; background:linear-gradient(to right,var(--gold),var(--teal)); border-radius:99px; transition:width .4s ease; }
  .progress-label{ font-size:12px; color:var(--muted); letter-spacing:0.04em; margin-bottom:28px; }

  /* QUESTION */
  .q-card{ animation:slide .45s ease both; }
  .q-num{ font-size:12px; letter-spacing:0.14em; color:var(--gold); font-weight:600; margin-bottom:10px; }
  .q-text{ font-family:'Playfair Display',serif; font-weight:400; font-size:clamp(22px,4.5vw,30px); color:var(--text); line-height:1.3; margin-bottom:28px; }
  .options{ display:flex; flex-direction:column; gap:12px; }
  .opt{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:18px 20px; text-align:left; font-family:'Inter',sans-serif; font-size:15px; color:var(--text); cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:14px; }
  .opt:hover{ border-color:var(--teal); box-shadow:0 4px 20px rgba(27,122,130,0.12); transform:translateY(-2px); }
  .opt .emoji{ font-size:22px; flex-shrink:0; }

  .back-btn{ margin-top:24px; background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; }
  .back-btn:hover{ color:var(--teal); }

  /* RESULT */
  .result{ animation:fade .55s ease both; }
  .result .reveal-kicker{ text-align:center; font-size:12px; letter-spacing:0.16em; color:var(--gold); margin-bottom:8px; }
  .result h2{ text-align:center; font-family:'Playfair Display',serif; font-weight:400; font-size:clamp(26px,5vw,38px); color:var(--teal-dark); line-height:1.2; margin-bottom:24px; }
  .tea-card{ background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 12px 48px rgba(15,63,69,0.14); }
  .tea-img{ width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--cream-dark); display:block; }
  .tea-body{ padding:28px 26px 30px; }
  .tea-tagline{ font-family:'Playfair Display',serif; font-style:italic; font-size:17px; color:var(--teal); margin-bottom:14px; }
  .tea-desc{ font-size:14px; color:#444; line-height:1.75; margin-bottom:18px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px; }
  .chip{ background:rgba(27,122,130,0.08); color:var(--teal); font-size:12px; font-weight:600; padding:6px 12px; border-radius:99px; }
  .cta-row{ display:flex; flex-direction:column; gap:10px; }
  .btn-primary{ background:var(--gold); color:var(--teal-dark); text-align:center; padding:15px; border-radius:10px; font-weight:600; font-size:15px; text-decoration:none; transition:transform .15s; }
  .btn-primary:hover{ transform:scale(1.02); }
  .btn-wa{ background:#25D366; color:#fff; text-align:center; padding:15px; border-radius:10px; font-weight:600; font-size:15px; text-decoration:none; transition:transform .15s; }
  .btn-wa:hover{ transform:scale(1.02); }
  .retake{ display:block; margin:24px auto 0; background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; text-decoration:underline; }
  .retake:hover{ color:var(--teal); }

  .start-btn{ background:var(--teal); color:#fff; border:none; padding:16px 40px; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; transition:transform .15s, box-shadow .2s; box-shadow:0 6px 24px rgba(27,122,130,0.25); }
  .start-btn:hover{ transform:scale(1.04); }

  footer{ text-align:center; padding:24px; font-size:12px; color:var(--muted); }
  footer a{ color:var(--teal); text-decoration:none; }

  @keyframes fade{ from{opacity:0;} to{opacity:1;} }
  @keyframes slide{ from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);} }
  @media(max-width:600px){ nav{padding:0 16px;} .wrap{padding:28px 18px 60px;} }
</style>
</head>
<body>

<nav>
  <a href="https://nevisan.in" class="nav-logo">NEVISAN</a>
  <a href="https://nevisan.in/#collection" class="nav-shop">Shop Now</a>
</nav>

<div class="wrap">
  <div id="app"></div>
</div>

<footer>
  <a href="https://nevisan.in">nevisan.in</a> &nbsp;·&nbsp; © 2026 Nevisan Tea · Golaghat, Assam &nbsp;·&nbsp; <a href="https://nevisan.in/faq">Tea FAQ</a>
</footer>

<script>
const WA = "919864245687";

const TEAS = {
  lemongrass:{ name:"Lemongrass Green Tea", img:"/teas/lemongrass.png",
    tagline:"Bright, citrusy and made for your mornings.",
    desc:"Whole-leaf Assam green tea blended with lemongrass. It relaxes the digestive tract, supports metabolism and gives clean, calm energy — the perfect way to start the day.",
    chips:["Digestion","Metabolism","Morning"] },
  blueflower:{ name:"Blue Flower Green Tea", img:"/teas/blue-flower.png",
    tagline:"Antioxidant-rich — and it turns purple with lemon.",
    desc:"Butterfly pea flower blended with whole-leaf green tea. Packed with anthocyanin antioxidants for focus and calm, with a stunning cobalt-blue brew that shifts to purple when you add a squeeze of lemon.",
    chips:["Antioxidants","Calming","Eye-catching"] },
  rum:{ name:"Rum Green Tea", img:"/teas/rum.png",
    tagline:"All the warmth of aged rum — zero alcohol.",
    desc:"A warm, slightly sweet evening cup built entirely from natural botanicals. No alcohol, no artificial flavour — just a bold, exotic ritual to wind down with.",
    chips:["Bold & exotic","Non-alcoholic","Evening"] },
  spearmint:{ name:"Spearmint Green Tea", img:"/teas/spearmint.png",
    tagline:"Clinically studied for hormonal balance.",
    desc:"Cool, refreshing spearmint with whole-leaf green tea. Research shows two cups daily can lower free testosterone — supporting PCOS, clearer skin and hormonal balance.",
    chips:["PCOS support","Clearer skin","Cooling"] },
  tulsi:{ name:"Tulsi Green Tea", img:"/teas/tulsi.png",
    tagline:"India's ancient adaptogen for stress & immunity.",
    desc:"Holy basil blended with green tea — an adaptogen used in Ayurveda for 3,000 years. It lowers cortisol, strengthens immunity and keeps you calm and focused at any hour.",
    chips:["Stress relief","Immunity","Adaptogen"] },
  chamomile:{ name:"Chamomile Green Tea", img:"/teas/chamomile.png",
    tagline:"Your gentle, floral wind-down before bed.",
    desc:"Whole chamomile flowers with low-caffeine green tea. The apigenin in chamomile binds to calming receptors in the brain — easing anxiety and improving sleep quality.",
    chips:["Better sleep","Calming","Evening"] },
  whiskey:{ name:"Whiskey Green Tea", img:"/teas/whiskey.png",
    tagline:"Bold, smoky character — completely alcohol-free.",
    desc:"A sophisticated, woody cup that captures the depth of aged whiskey using only natural botanicals. Rich in EGCG antioxidants and perfect for whiskey lovers seeking a non-alcoholic ritual.",
    chips:["Bold & smoky","Non-alcoholic","Sophisticated"] },
  gaba:{ name:"GABA Oolong Tea", img:"/teas/gaba.png",
    tagline:"Calm and focus, without the drowsiness.",
    desc:"Oolong processed to dramatically boost GABA — your brain's natural calming signal. It eases anxiety, improves sleep and lowers blood pressure, all while keeping you mentally present.",
    chips:["Relaxation","Focus","Better sleep"] },
  organic:{ name:"Organic Green Tea", img:"/teas/organic.png",
    tagline:"The pure, classic single-origin cup.",
    desc:"100% whole-leaf organic green tea from a single garden in Golaghat, Assam. Grassy, smooth and full of EGCG antioxidants and L-theanine — a versatile everyday favourite.",
    chips:["Antioxidants","Everyday","Classic"] }
};

const QUESTIONS = [
  { q:"What are you mainly looking for in a cup?",
    opts:[
      {e:"😴", t:"Calm & better sleep", s:{gaba:2,chamomile:2}},
      {e:"⚡", t:"Clean energy & focus", s:{organic:2,lemongrass:2,gaba:1}},
      {e:"🌸", t:"Hormonal balance & clearer skin", s:{spearmint:3}},
      {e:"🛡️", t:"Stress relief & immunity", s:{tulsi:3}},
      {e:"🥃", t:"Something bold & unusual", s:{rum:2,whiskey:2}},
      {e:"🍃", t:"Antioxidants & a wellness boost", s:{blueflower:2,organic:1,tulsi:1}}
    ]},
  { q:"When will you mostly drink it?",
    opts:[
      {e:"🌅", t:"Morning kick-start", s:{lemongrass:2,organic:2,spearmint:1}},
      {e:"☀️", t:"Afternoon pick-me-up", s:{blueflower:2,tulsi:1,whiskey:1,rum:1}},
      {e:"🌙", t:"Evening wind-down", s:{chamomile:2,gaba:2,rum:1}}
    ]},
  { q:"Pick a flavour you'd love",
    opts:[
      {e:"🍋", t:"Light & citrusy", s:{lemongrass:2}},
      {e:"🌼", t:"Floral & smooth", s:{blueflower:2,chamomile:1,gaba:1}},
      {e:"🌿", t:"Cool & minty", s:{spearmint:2}},
      {e:"🔥", t:"Bold & rich", s:{rum:2,whiskey:2}},
      {e:"🍵", t:"Classic & grassy", s:{organic:2,tulsi:1}}
    ]},
  { q:"How do you feel about caffeine?",
    opts:[
      {e:"💥", t:"Bring the energy", s:{organic:1,lemongrass:1,whiskey:1}},
      {e:"🤲", t:"Keep it gentle & low", s:{chamomile:2,gaba:1,spearmint:1}},
      {e:"🤷", t:"Doesn't matter to me", s:{tulsi:1,blueflower:1,rum:1}}
    ]}
];

const app = document.getElementById('app');
let step = 0;            // -1 not used; 0..QUESTIONS.length-1; then result
let scores = {};
let history = [];

function reset(){ step=0; scores={}; Object.keys(TEAS).forEach(k=>scores[k]=0); history=[]; }

function renderIntro(){
  app.innerHTML = `
    <div class="intro">
      <span class="kicker">2-MINUTE QUIZ</span>
      <h1>Find Your<br>Perfect Tea</h1>
      <p>Nine single-origin whole-leaf teas from Golaghat, Assam. Answer 4 quick questions and we'll match you with yours.</p>
      <button class="start-btn" id="start">Start the quiz →</button>
    </div>`;
  document.getElementById('start').onclick = ()=>{ reset(); renderQuestion(); };
}

function renderQuestion(){
  const Q = QUESTIONS[step];
  const pct = (step/QUESTIONS.length)*100;
  app.innerHTML = `
    <div class="progress-shell"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="progress-label">Question ${step+1} of ${QUESTIONS.length}</div>
    <div class="q-card">
      <div class="q-num">Q${step+1}</div>
      <div class="q-text">${Q.q}</div>
      <div class="options">
        ${Q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="emoji">${o.e}</span><span>${o.t}</span></button>`).join('')}
      </div>
      ${step>0?'<button class="back-btn" id="back">← Back</button>':''}
    </div>`;
  // animate bar to next position on next frame
  requestAnimationFrame(()=>{ document.querySelector('.progress-bar').style.width = ((step+1)/QUESTIONS.length*100)+'%'; });
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      const o = Q.opts[btn.dataset.i];
      for(const k in o.s){ scores[k]+=o.s[k]; }
      history.push(o.s);
      step++;
      if(step>=QUESTIONS.length) renderResult();
      else renderQuestion();
    };
  });
  const back = document.getElementById('back');
  if(back) back.onclick = ()=>{
    step--;
    const last = history.pop();
    for(const k in last){ scores[k]-=last[k]; }
    renderQuestion();
  };
}

function renderResult(){
  // highest score wins; ties broken by TEAS order
  let best=null, bestScore=-1;
  for(const k of Object.keys(TEAS)){ if(scores[k]>bestScore){ bestScore=scores[k]; best=k; } }
  const t = TEAS[best];
  const waMsg = encodeURIComponent(`Hi Nevisan! The tea quiz matched me with *${t.name}*. I'd like to order it (MRP ₹499 · 50 gm). Please help me with the details.`);
  app.innerHTML = `
    <div class="result">
      <div class="reveal-kicker">YOUR PERFECT MATCH</div>
      <h2>${t.name}</h2>
      <div class="tea-card">
        <img class="tea-img" src="${t.img}" alt="${t.name}" loading="eager">
        <div class="tea-body">
          <div class="tea-tagline">“${t.tagline}”</div>
          <div class="tea-desc">${t.desc}</div>
          <div class="chips">${t.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
          <div class="cta-row">
            <a class="btn-primary" href="https://nevisan.in/?tea=${encodeURIComponent(t.name)}">Shop ${t.name} →</a>
            <a class="btn-wa" href="https://wa.me/${WA}?text=${waMsg}" target="_blank" rel="noopener">💬 Order on WhatsApp</a>
          </div>
        </div>
      </div>
      <button class="retake" id="retake">↺ Retake the quiz</button>
    </div>`;
  document.getElementById('retake').onclick = ()=>{ reset(); renderIntro(); };
}

renderIntro();
</script>
</body>
</html>

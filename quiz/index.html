    const container = document.getElementById("quiz-question-container");

    // Start rendering the first question
    function renderQuestion() {
      // Update step dots
      for (let i = 0; i < 3; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i === currentStep) {
          dot.classList.add("active");
        } else {
          dot.classList.remove("active");
        }
      }

      const q = questions[currentStep];
      container.innerHTML = `
        <h2 class="question-title">${q.title}</h2>
        <div class="options-list">
          ${q.options.map((opt, index) => `
            <button class="option-btn" onclick="selectOption(${index})">
              <span class="option-emoji">${opt.emoji}</span>
              <span>${opt.text}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    // Handle user option selection
    window.selectOption = function(optionIndex) {
      userSelections.push(questions[currentStep].options[optionIndex]);
      
      if (currentStep < 2) {
        currentStep++;
        renderQuestion();
      } else {
        showResults();
      }
    };

    // Calculate scores and show results

        for (const key in selection.scores) {
          if (scores.hasOwnProperty(key)) {
            scores[key] += selection.scores[key];
          }
        }
      });

      // Find the highest score tea
      let recommendedKey = "organic"; // Default fallback
      let highestScore = -1;
      
      for (const key in scores) {
        if (scores[key] > highestScore) {
          highestScore = scores[key];
          recommendedKey = key;
        }
      }

      const rec = teas[recommendedKey];
      const card = document.getElementById("quiz-card");

      // Animate background colors of the card based on recommended tea theme
      card.style.background = rec.bg;

      // Construct Result Panel
      const whatsappMsg = encodeURIComponent(`Hi Nevisan! I took your Tea Quiz and my recommended match is ${rec.name}. I'd like to place an order or get more information!`);
      const whatsappUrl = `https://wa.me/919864245687?text=${whatsappMsg}`;

      try {
        if (typeof fbq !== "undefined") {
          fbq("track", "Lead", { content_name: rec.name });
        }
      } catch (e) {}

      document.getElementById("quiz-flow").innerHTML = `
        <div class="result-view">
          <div class="result-badge">Your Recommended Blend</div>
          <div class="result-image-container">
            <img src="${rec.img}" alt="${rec.name}">
          </div>
          <h2 class="result-title">${rec.name}</h2>
          <div class="result-benefit">✨ Benefit: ${rec.benefit}</div>
          <p class="result-desc">${rec.desc}</p>
          
          <div class="buy-options-header">Choose Where To Buy</div>
          <div class="buy-grid">
            <a href="${whatsappUrl}" target="_blank" rel="noopener" class="buy-btn buy-whatsapp" onclick="trackQuizClick('${recommendedKey}', 'WhatsApp')">
              💬 Order Direct via WhatsApp
            </a>
            <a href="${rec.amazon}" target="_blank" rel="noopener" class="buy-btn buy-amazon" onclick="trackQuizClick('${recommendedKey}', 'Amazon')">
              📦 Buy on Amazon India
            </a>
            <a href="${rec.flipkart}" target="_blank" rel="noopener" class="buy-btn buy-flipkart" onclick="trackQuizClick('${recommendedKey}', 'Flipkart')">
              🛒 Buy on Flipkart
            </a>
          </div>
          
          <button class="restart-btn" onclick="restartQuiz()">
            ↺ Take Quiz Again
          </button>
        </div>
      `;
    }

    // Restart Quiz
    window.restartQuiz = function() {
      currentStep = 0;
      userSelections.length = 0;
      
      // Reset card styling
      const card = document.getElementById("quiz-card");
      card.style.background = "rgba(255, 255, 255, 0.72)";

      // Restore layout
      document.getElementById("quiz-card").innerHTML = `
        <div id="quiz-flow">
          <div class="quiz-header">
            <h1>Find Your Perfect Blend</h1>
            <p>Answer 3 quick questions to discover your personalized Nevisan tea match.</p>
          </div>
          
          <div class="steps">
            <div class="step-dot active" id="dot-0"></div>
            <div class="step-dot" id="dot-1"></div>
            <div class="step-dot" id="dot-2"></div>
          </div>

          <div id="quiz-question-container">
            <!-- Question content dynamically rendered -->
          </div>
        </div>
      `;
      // Re-get container reference as DOM was rebuilt
      container = document.getElementById("quiz-question-container");
      renderQuestion();
    };

    // Initialize
    renderQuestion();
  </script>
</body>
</html>
